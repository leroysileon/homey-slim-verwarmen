<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    /* Alles hangt onder #sv: een ID wint van de standaardopmaak die Homey over knoppen en velden legt. */
    #sv {
      --bg: #f2f2f7; --card: #ffffff; --card-2: #f2f2f6; --text: #17171a; --muted: #6c6c72; --line: #e3e3e8; --danger: #d92d33; /* zelfde grijs als de Homey-app */
      --link: #1f6fe5; --warm: #ee8a35; --warm-text: #b45f12; --cold-bg: #d6ecea; --cold-text: #1f6f69;
      --tile-heat: linear-gradient(160deg, #f3b25f, #e58a2c); --tile-idle: linear-gradient(160deg, #cfe3e4, #b7d3d6);
      --tile-text-heat: #3a1f02; --tile-text-idle: #0f3a3d; --pill: rgba(0,0,0,.08); --press: #e9e9ee;
      background: var(--bg); color: var(--text); min-height: 100vh; padding: 8px 8px 110px; overflow-x: clip; /* clip i.p.v. hidden: anders werkt het vaste snelmenu niet */
      font: 400 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      #sv { --bg: #14151a; --card: #22232b; --card-2: #2c2d36; --text: #f5f5f5; --muted: #9a9ba3; --line: #363742; /* blauwzwart zoals de Homey-app */
        --link: #3d8bff; --warm: #f2a23a; --warm-text: #f6b45a; --cold-bg: #23484b; --cold-text: #5fd0c6;
        --tile-heat: linear-gradient(160deg, #6b4210, #4a2c08); --tile-idle: linear-gradient(160deg, #163b3f, #0e2a2e);
        --tile-text-heat: #f6b45a; --tile-text-idle: #5fd0c6; --pill: rgba(255,255,255,.12); --press: #333438; }
    }
    /* Achtergrond tot in de onderrand (ook de ruimte die iOS vrijhoudt en bij doorscrollen). */
    /* Homey zet standaard binnenruimte om de pagina; die halen we weg, de pagina regelt zelf de marge. */
    /* Naar beneden trekken mag geen wit vlak tonen: geen 'verend' scrollen, en de standaard achtergrond volgt licht/donker. */
    html { color-scheme: light dark; touch-action: manipulation; } /* snel twee keer tikken = twee tikken, niet inzoomen of verschuiven */
    html, body { margin: 0 !important; padding: 0 !important; background: #14151a !important; min-height: 100%; overscroll-behavior-y: none; }
    @media (prefers-color-scheme: light) { html, body { background: #f2f2f7 !important; } }
    /* Onderaan alleen ruimte voor de opslaan-balk als die er is. */
    #sv { padding-bottom: calc(24px + env(safe-area-inset-bottom)); transition: padding-bottom .2s; }
    #sv.has-savebar { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
    #sv * { box-sizing: border-box; }
    #sv h1 { all: unset; display: block; font-size: 32px; font-weight: 700; letter-spacing: -.01em; margin: 0 4px 16px; }
    #sv h2 { all: unset; display: block; font-size: 22px; font-weight: 700; margin: 30px 4px 12px; }
    #sv .muted { color: var(--muted); }
    #sv small { font-size: 14px; color: var(--muted); }

    /* Knoppen */
    #sv button { all: unset; box-sizing: border-box; cursor: pointer; font: inherit; font-weight: 500; text-align: center;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
      border-radius: 999px; background: var(--pill); color: inherit; transition: background .12s, transform .06s; }
    #sv button:active { transform: scale(.97); }
    #sv button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
    #sv button.busy { opacity: .7; pointer-events: none; animation: sv-pulse 1s ease-in-out infinite; }
    @keyframes sv-pulse { 50% { opacity: .45; } }
    #sv button.link { background: none; padding: 0 4px; color: var(--link); min-height: 36px; font-size: 14px; font-weight: 500; }
    #sv button.solid { background: var(--warm); color: #1d1203; }
    #sv svg { width: 22px; height: 22px; flex: none; }

    /* Statustegel */
    /* Kleuren vloeiend laten overlopen: de warme laag fade in/uit, tekstkleur schuift mee. */
    /* Statustegel = de widget zelf (iframe), knoppen ruim eronder */
    #tileframe { display: block; width: 100%; height: 242px; border: 0; background: transparent; overflow: hidden; }
    #sv .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    #sv .err { margin-top: 12px; font-weight: 600; }

    /* Dagkaarten */
    #sv .daycard { background: var(--card); border-radius: 20px; padding: 16px 14px 10px; margin-bottom: 12px; }
    @media (max-width: 370px) { #sv .daycard { padding-left: 10px; padding-right: 10px; } }
    #sv .daycard .head { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; width: 100%; cursor: pointer; min-height: 32px; }
    #sv .daycard .head .t { font-size: 22px; font-weight: 500; }
    #sv .daycard .head .today { font-size: 15px; font-weight: 600; color: var(--warm-text); margin-left: 8px; }
    #sv .daycard > .head .chev { transition: transform .2s; color: var(--muted); }
    #sv .daycard.open > .head .chev { transform: rotate(180deg); }
    #sv .bar { display: flex; height: 30px; margin-top: 14px; border-radius: 8px; overflow: hidden; gap: 2px; }
    #sv .bar i { display: flex; align-items: center; height: 100%; padding: 0 7px; font-style: normal; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; }
    #sv .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 8px 0 0; }
    #sv .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 6px; }
    #sv .copybtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--link); font-weight: 500; font-size: 14px; min-height: 36px; }
    #sv .copybtn svg { width: 17px; height: 17px; }
    #sv .copymenu { display: none; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
    #sv .copymenu.show { display: flex; }
    #sv .copymenu button { min-height: 38px; padding: 0 14px; font-size: 15px; }

    /* Tijdsblokken bewerken */
    #sv .edit { display: none; margin-top: 14px; }
    #sv .daycard.open .edit { display: block; }
    /* Kop met knop Vandaag */
    #sv .h2row { display: flex; align-items: center; justify-content: space-between; margin: 30px 4px 12px; }
    #sv .h2row h2 { margin: 0; }
    #sv .h2row button { min-height: 36px; padding: 0 14px; font-size: 15px; }
    /* Nu-streepje in de balk van vandaag */
    #sv .barwrap { position: relative; margin-top: 14px; }
    #sv .barwrap .bar { margin-top: 0; }
    #sv .barwrap .now { position: absolute; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 2px var(--card); transform: translateX(-1.5px); pointer-events: none; }
    /* Tijdvakken per dag */
    #sv .slots { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
    /* Hoeken op elkaar afgestemd: blok (16) = invoerveld (8) + ruimte eromheen (8). Geen streepje: de tint zegt genoeg. */
    #sv .slot { position: relative; border-radius: 16px; background: var(--tint); overflow: hidden; }
    /* Tekst, tijd en knoppen in de tint van het blok (zoals de balk); velden en knoppen als laag erover. */
    #sv .slot { color: var(--ink); }
    #sv .slot .sh .st, #sv .slot .se .to, #sv .slot .se .del { color: var(--ink); opacity: .75; }
    #sv .slot .se input[type=time] { background: rgba(255,255,255,.55); color: var(--ink); }
    #sv .slot .stepper button { background: rgba(0,0,0,.07); color: var(--ink); }
    @media (prefers-color-scheme: dark) {
      #sv .slot .se input[type=time] { background: rgba(255,255,255,.08); }
      #sv .slot .stepper button { background: rgba(255,255,255,.1); }
    }
    #sv .slot .sh { all: unset; box-sizing: border-box; display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 10px 14px 10px 16px; }
    #sv .slot .sh .range { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #sv .slot .sh .st { font-size: 14px; color: var(--muted); }
    #sv .slot .sh svg.chev { width: 22px; height: 22px; color: var(--muted); transition: transform .2s; flex: none; }
    #sv .slot.fixed .sh { cursor: default; align-items: center; min-height: 58px; padding: 8px 12px 8px 16px; }
    /* Loopt door van de dag ervoor: geen vulling, alleen een dunne rand in de temperatuurkleur, zodat het niet als knop oogt. */
    #sv .slot.fixed { background: transparent; border: 1.5px solid var(--tint); }
    #sv .slot.fixed .sh { min-height: 55px; padding: 8px 10.5px 8px 14.5px; }
    #sv .slot.fixed .sh .range, #sv .slot.fixed .sh .tv { font-weight: 500; color: var(--muted); }
    #sv .slot.fixed .sh .st { opacity: 1; }
    @keyframes slotIn2 { from { opacity: 0; transform: translateY(-4px); } }
    #sv .slot.flash { animation: slotFlash 1.2s ease; }
    /* Tijdsblokken neutraal; de temperatuurkleur zit alleen in een lijn links. */
    #sv .slot { --tint: var(--card-2) !important; --ink: var(--text) !important; }
    #sv .slot::before { content: ''; position: absolute; left: 9px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--c); z-index: 1; pointer-events: none; }
    #sv .slot .sh, #sv .slot .se .sh, #sv .slot .se .sh.oh, #sv .slot.fixed .sh { padding-left: 26px !important; }
    #sv .slot .ed { padding-left: 20px !important; }
    #sv .slot.fixed { background: transparent; border: 1.5px solid var(--card-2); }
    #sv .slot.fixed::before { left: 7.5px; top: 10.5px; bottom: 10.5px; opacity: .55; }
    @keyframes slotFlash { 0%, 35% { box-shadow: 0 0 0 3px var(--ink); } 100% { box-shadow: 0 0 0 3px transparent; } }
    /* Label bij het blok dat nu actief is */
    #sv .slot .nowtag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 16px; vertical-align: 1px;
      background: var(--ink); color: var(--card); }
    #sv .slot.fixed .nowtag { background: var(--muted); }
    #sv .slot .se { display: flex; align-items: center; gap: 4px; padding: 8px 6px 8px 8px; }
    /* Dicht: één ruime regel (tijd, temperatuur, pijltje). Tik erop en het blok groeit met de knoppen eronder. */
    #sv .slot.editable .se { display: block; padding: 0; }
    #sv .slot .se .sh { cursor: pointer; align-items: center; min-height: 58px; padding: 8px 12px 8px 16px; -webkit-tap-highlight-color: transparent; }
    /* Tijd links, temperatuur rechts, dan het pijltje. */
    #sv .slot .sh .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    #sv .slot .se .sh svg.chev { flex: none; }
    #sv .slot .sh .tv { margin-left: auto; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; transition: opacity .15s; }
    #sv .slot.fixed .sh .tv { margin-right: 30px; } /* gelijk met de temperaturen naast een pijltje */
    #sv .slot .se .sh svg.chev { width: 20px; height: 20px; color: var(--ink); opacity: .6; transition: transform .22s ease; }
    #sv .slot.open .se .sh svg.chev { transform: rotate(180deg); }
    #sv .slot.open .se .sh .tv { opacity: 0; }
    #sv .slot .ed { display: flex; align-items: center; padding: 2px 10px 12px; overflow: hidden; }
    /* Open kop: begin- en eindtijd als velden, sluitpijltje rechts */
    /* Open kop lijkt op de dichte: zelfde letter, plek en pijltje; alleen een lichte laag achter de tijden. */
    #sv .slot .se .sh.oh { cursor: default; gap: 0; padding: 8px 12px 8px 16px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #sv .slot .se .sh.oh input[type=time] { width: 56px; height: 34px; min-height: 34px; line-height: 34px; font-size: 15px; font-weight: 600; padding: 0 5px; margin: 0 -1px 0 -5px; border-radius: 8px; text-align: center; }
    #sv .slot .se .sh.oh input[type=time]::-webkit-date-and-time-value { text-align: center; line-height: 34px; min-height: 34px; }
    #sv .slot .se .sh.oh input.end { margin-left: 0; }
    #sv .slot .se .sh.oh .to { font-size: 15px; color: var(--ink); opacity: 1; padding: 0 5px 0 4px; }
    #sv .slot .se .sh.oh .stepper { margin-left: auto; gap: 0; }
    #sv .slot .se .sh.oh .stepper button { width: 32px; min-height: 32px; height: 32px; }
    /* Maximumtemperatuur: 'max' als labeltje in de balk en de kop, en als rondje in plaats van + bij bewerken. */
    #sv .mx { margin-left: 4px; padding: 1px 5px; border-radius: 999px; background: rgba(0,0,0,.12); font-size: 10px; font-weight: 700; vertical-align: 1px; }
    #sv .slot .stepper .maxs { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; font-size: 11px; font-weight: 700; padding: 0; opacity: .8; }
    #sv .slot .se .sh.oh .stepper output { min-width: 50px; padding: 0 8px; font-size: 18px; }
    /* Verwijderen: brede, lichtrode knop met rode tekst (destructief, maar rustig) */
    #sv .slot .ed button.danger { flex: 1; min-height: 44px; border-radius: 999px; font-size: 15px; font-weight: 500; background: #fbe7e3; color: #cc3a1f; }
    @media (prefers-color-scheme: dark) { #sv .slot .ed button.danger { background: #4a2420; color: #ff8a75; } }
    #sv .slot .sh .endfix { padding-left: 0; }
    /* Inklappen: pijltje omhoog rechts naast Verwijderen (44×44 tikvlak). */
    #sv .slot .ed { gap: 8px; }
    #sv .slot .ed button.up { flex: none; width: 44px; min-height: 44px; margin-right: -10px; padding: 0; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; }
    #sv .slot .ed button.up svg.chev { width: 20px; height: 20px; transform: rotate(180deg); opacity: .6; } /* zelfde als de pijltjes in de kop */
    #sv .slot.opening .ed { animation: slotGrow .22s ease both; }
    #sv .slot.closing .ed { animation: slotShrink .18s ease both; }
    #sv .slot.closing .se .sh svg.chev { transform: none; }
    #sv .slot.closing .se .sh .tv { opacity: 1; }
    /* −/+ en prullenbak ploppen tevoorschijn naast de temperatuur die naar binnen schuift */
    #sv .slot.opening .stepper button { animation: popIn .28s cubic-bezier(.2,.8,.2,1) .1s both; }
    @keyframes popIn { from { opacity: 0; transform: scale(.4); } }
    @media (prefers-reduced-motion: reduce) { #sv .slot .ed, #sv .slot .ed * { animation: none !important; } }
    @keyframes slotGrow { from { max-height: 0; padding-bottom: 0; opacity: 0; } to { max-height: 80px; opacity: 1; } }
    @keyframes slotShrink { from { max-height: 80px; opacity: 1; } to { max-height: 0; padding-bottom: 0; opacity: 0; } }
    #sv .slot .se .from { display: flex; flex-direction: column; }
    #sv .slot .se .grow { flex: 1; }
    #sv .slot .se .del { width: 30px; min-height: 40px; padding: 0; color: var(--muted); }
    #sv .slot .se .del svg { width: 19px; height: 19px; }
    /* 'tot 12:00' klein achter de begintijd; temperatuurknoppen rechts uitgelijnd. */
    #sv .slot .se .to { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #sv .slot .se .to small { font-size: inherit; color: inherit; }
    #sv .slot .se .stepper { margin-left: auto; }
    #sv .slot .se input[type=time] { height: 40px; min-height: 40px; line-height: 40px; width: 70px; font-size: 17px; border-radius: 8px; padding: 0 4px; margin: 0; }
    #sv .slot .se input[type=time]::-webkit-date-and-time-value { line-height: 40px; min-height: 40px; }
    #sv .block { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 8px 6px 8px 18px; position: relative;
      background: var(--card-2); border-radius: 14px; margin-bottom: 8px; }
    #sv .block::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: var(--c); }
    #sv .block .from small { display: block; text-align: center; font-size: 13px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
    #sv .stepper { display: flex; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
    #sv .stepper output { min-width: 50px; padding: 0 5px; text-align: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #sv .stepper button { width: 36px; min-height: 36px; padding: 0; flex: none; }
    #sv .stepper button svg, #sv .fstep button svg { width: 16px; height: 16px; display: block; }
    #sv .del { width: 34px; min-height: 36px; padding: 0; background: none; color: var(--muted); }
    #sv .empty { padding: 14px; border-radius: 14px; background: var(--card-2); color: var(--muted); text-align: center; margin-bottom: 8px; }

    /* Eerste keer instellen */
    #sv.setup:not(.show-main) #main { display: none; }
    /* Opslaan gaat vanzelf; de knop is er alleen om tijdens het eerste instellen terug te gaan naar de stappen. */
    #sv #setupBack { display: none; } #sv.setup.show-main #setupBack { display: block; }
    #sv.setup #status, #sv.setup .fresh { display: none; }
    #setup .hello h2 { all: unset; display: block; font-size: 21px; font-weight: 700; margin: 2px 0 4px; }
    #setup .hello p, #setup .sub { margin: 0; color: var(--muted); }
    #setup .prog { display: flex; gap: 6px; margin: 14px 0 4px; }
    #setup .prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
    #setup .prog i.on { background: #45c08f; }
    #setup .progt { font-size: 13px; color: var(--muted); }
    #setup .card { margin-bottom: 12px; }
    #setup .step { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
    #setup .step:first-child { border-top: 0; padding-top: 2px; }
    #setup .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--card-2); color: var(--muted); }
    #setup .num.done { background: #45c08f; color: #fff; }
    #setup .num.now { background: var(--text); color: var(--card); }
    #setup .num svg { width: 15px; height: 15px; }
    #setup .sbody { flex: 1; min-width: 0; }
    #setup .sbody > b { display: block; font-size: 16px; }
    #setup .sub { font-size: 14px; margin-top: 2px; }
    #setup .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
    #setup .found { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); font-size: 14px; }
    #setup .found > span { min-width: 0; }
    #setup .found small { display: block; color: var(--muted); }
    #setup .links { display: flex; gap: 10px; flex: none; }
    #setup button.wide { width: 100%; margin-top: 10px; }
    #setup button.start { width: 100%; background: #45c08f; color: #fff; font-weight: 600; font-size: 16px; min-height: 50px; }
    #setup button.start:disabled { opacity: .45; }
    #setup .note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 10px 4px 0; }
    #setup .note svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
    #setup .dayl { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-top: 14px; }
    #setup .dayl span { color: var(--muted); font-weight: 400; }
    #setup .pbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 6px; }
    #setup .pbar i { display: flex; align-items: center; padding: 0 6px; font-style: normal; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; }
    #setup .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
    #setup .done-card { text-align: center; }
    #setup .done-card .check { width: 56px; height: 56px; border-radius: 50%; background: #45c08f; color: #fff; display: grid; place-items: center; margin: 4px auto 10px; }
    #setup .done-card .check svg { width: 28px; height: 28px; }
    #setup .done-card h2 { all: unset; display: block; font-size: 21px; font-weight: 700; margin: 0 0 6px; }
    #setup .first { margin-top: 14px; padding: 12px; border-radius: 14px; background: #d7f3e6; color: #1d6f4f; font-size: 14px; text-align: left; }
    #setup .first b { display: block; }
    @media (prefers-color-scheme: dark) { #setup .first { background: #1c4636; color: #6fdcae; } }

    /* Verloop van een dag */
    #sv .hhd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    #sv .hroom { font-weight: 600; }
    #sv .hnav { display: flex; align-items: center; gap: 6px; }
    #sv .hnav b { font-size: 16px; min-width: 84px; text-align: center; font-weight: 600; }
    #sv button.harr { width: 36px; min-height: 36px; height: 36px; padding: 0; color: var(--muted); display: grid; place-items: center; }
    #sv button.harr svg { width: 18px; height: 18px; display: block; }
    #sv button.harr:disabled { opacity: .35; }
    /* Onderrand: cijfers links, vergroten rechtsonder. */
    #sv .hfoot { display: flex; align-items: flex-end; gap: 8px; margin: 8px 0 0 2px; }
    #sv .hsum { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; font-size: 12.5px; color: var(--muted); }
    #sv .hsum span { display: flex; flex-direction: column; }
    #sv .hsum b { font-size: 16px; color: var(--text); font-weight: 600; }

    #sv .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) { #sv .toast { transition: none; } }
  </style>
</head>
<body>
<div id="sv">
  <div id="setup"></div>
  <div id="main">
  <nav class="qnav" id="qnav" aria-label="Snel naar">

    <div class="qscroll" id="qscroll"><button data-go="secHist">Terugkijken</button><button data-go="secWeek">Schema</button><button data-go="secLearn">Opwarmtijd</button></div>
    <!-- Instellingen apart rechts: altijd met één tik bereikbaar, ook als de tekstbalk niet past. -->

  </nav>

  </div>

    <div class="hhd"><span class="hroom"><span id="hRoom"></span></span>
      <span class="hnav"><button class="harr" id="hPrev" aria-label="Dag eerder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button><b id="hDay">Vandaag</b><button class="harr" id="hNext" aria-label="Dag later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button></span></div>
    <div class="hwrap"> <svg id="hChart" class="hchart" width="100%" viewBox="0 0 340 196" role="img" aria-label="Temperatuurverloop. Houd ingedrukt en schuif voor details."></svg><div class="htip" id="hTip" hidden></div></div>
    <div class="hfoot"><div class="hsum" id="hSum"></div><button class="harr hexp" id="hFull" aria-label="Verloop groot bekijken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button></div>
    <p class="hnote" id="usageNote" hidden></p>
  </div>

  <div class="h2row" id="secWeek"><h2>Schema</h2><button id="goToday">Vandaag</button></div>
  <div id="week"></div>

  <h2 id="secLearn">Opwarmtijd</h2>
  <p class="pnote" id="preNote"></p>
  <div class="card" id="learned"><span class="muted">Laden…</span></div>

  <h2 id="secCfg">Instellingen</h2>
  <div class="card">
    <!-- Ingedeeld in groepen; 'Extra' is optioneel en klapt pas open als je hem aanzet. -->
    <h3 class="cg">Apparaten</h3>
    <label for="thermostat">Thermostaat</label>
    <select id="thermostat"></select>

    <label for="outdoor">Buitentemperatuur <span class="lh">· voor de opwarmtijd</span></label>
    <select id="outdoor"></select>

    <h3 class="cg">Thuis en weg</h3>
    <label id="ecoLbl">Temperatuur als niemand thuis is</label>
    <div class="fstep" role="group" aria-labelledby="ecoLbl">
      <button data-cfg="ecoTemp" data-d="-0.5" aria-label="Kouder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <output id="ecoTempOut"></output>
      <button data-cfg="ecoTemp" data-d="0.5" aria-label="Warmer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>

    <label class="toggle" for="autoPres" id="presToggle">
      <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5 3.8 10.3c-.8.3-.7 1.4.1 1.6l6.6 1.6 1.6 6.6c.2.8 1.3.9 1.6.1z"/></svg></span>
      <span class="tt"><b>Thuis/Afwezig-detectie</b><small>Iedereen de deur uit? Dan zakt de temperatuur naar de stand hierboven.<span id="presNow" hidden></span></small></span>
      <input id="autoPres" type="checkbox" role="switch"><span class="knob" aria-hidden="true"></span>
    </label>

    <h3 class="cg">Verwarmen</h3>
    <label for="overrideDefault">Handmatige bediening temperatuur actief</label>
    <select id="overrideDefault">
      <!-- Zelfde keuzes als de snelkeuzes in de widget. -->
      <option value="next">tot volgend blok</option>
      <option value="60">1 uur</option>
      <option value="120">2 uur</option>
      <option value="180">3 uur</option>
      <option value="manual">tot je het schema hervat</option>
    </select>

    <!-- Maximumtemperatuur: niemand kan warmer zetten dan dit (schema, widget, knop op de thermostaat). -->
    <div class="tblock tgap">
    <label class="toggle" for="limitOn" id="limitToggle">
      <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M18 4h3M18 8h3"/></svg></span>
      <span class="tt"><b>Maximumtemperatuur</b><small>Niemand kan de verwarming hoger zetten, ook niet via de knop op de thermostaat.</small></span>
      <input id="limitOn" type="checkbox" role="switch"><span class="knob" aria-hidden="true"></span>
    </label>
    <div id="limitWrap" hidden>
      <label id="limitLbl">Nooit warmer dan</label>
      <div class="fstep" role="group" aria-labelledby="limitLbl">
        <button data-cfg="maxTemp" data-d="-0.5" aria-label="Lager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <output id="maxTempOut"></output>
        <button data-cfg="maxTemp" data-d="0.5" aria-label="Hoger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>
    </div>

    <div class="tblock tgap">
    <label class="toggle" for="preheat" id="preToggle">
      <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></span>
      <span class="tt"><b>Op tijd warm</b><small>Begint vanzelf eerder met verwarmen, zodat het op het ingestelde tijdstip al warm is. Uit: de verwarming begint pas op dat tijdstip.</small></span>
      <input id="preheat" type="checkbox" role="switch"><span class="knob" aria-hidden="true"></span>
    </label>

    <div id="preWrap">
      <label id="preLbl">Maximaal eerder beginnen</label>
      <div class="fstep" role="group" aria-labelledby="preLbl">
        <button data-cfg="maxPreheat" data-d="-15" aria-label="Korter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <output id="maxPreheatOut"></output>
        <button data-cfg="maxPreheat" data-d="15" aria-label="Langer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>
    </div>

    <!-- Optioneel: na aanzetten verschijnen meter en prijs ín hetzelfde blok. -->
    <div class="tsec"><div class="tblock">
    <label class="toggle" for="usageOn" id="usageToggle">
      <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5.5.8 1.2 1.6 1.8 2.5 2C11.7 7.5 11.5 5.5 12 3z"/></svg></span>
      <span class="tt"><b>Verbruik en kosten</b><small>Laat bij Terugkijken zien hoeveel gas of stroom er die dag is gebruikt en wat dat kostte. Werkt met een slimme meter in Homey.</small></span>
      <input id="usageOn" type="checkbox" role="switch"><span class="knob" aria-hidden="true"></span>
    </label>
    <div id="usageWrap" hidden>
      <label for="meter">Meter</label>
      <select id="meter"></select>
      <div id="priceWrap" hidden>
        <label id="priceLbl">Prijs per m³</label>
        <div class="fstep" role="group" aria-labelledby="priceLbl">
          <button data-cfg="price" data-d="-0.05" aria-label="Lager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
          <output id="priceOut"></output>
          <button data-cfg="price" data-d="0.05" aria-label="Hoger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
        </div>

      </div>
    </div>
    </div></div>

    <div class="actions" id="setupBack"><button class="solid" id="saveConfig">Terug naar de stappen</button></div>
  </div>

  </div><!-- /main -->
  <!-- Verloop groot: schermvullend; rechtop gehouden telefoon → een kwartslag gedraaid, zodat de grafiek over de lengte loopt -->
  <div class="hfs" id="hFs" hidden>
    <div class="hfsbox">
      <div class="hhd"><button class="hback" id="hFsBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>Terug</button>
        <span class="hnav"><button class="harr" id="fsPrev" aria-label="Dag eerder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button><b id="fsDay">Vandaag</b><button class="harr" id="fsNext" aria-label="Dag later"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button></span></div>
      <div class="hwrap hfswrap"><svg id="fsChart" class="hchart" role="img" aria-label="Temperatuurverloop, groot"></svg><div class="htip" id="fsTip" hidden></div></div>

  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_LONG = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
const DEFAULT_BLOCKS = [{ time: '06:30', temp: 20 }, { time: '22:30', temp: 16 }]; // zelfde voorstel als de app
const WEEKEND_BLOCKS = [{ time: '08:00', temp: 20 }, { time: '23:00', temp: 16 }];
const MODES = {
  schedule: 'Volgens schema', preheat: 'Aan het voorverwarmen', manual: 'Handmatig',
  away: 'Niemand thuis', paused: 'Gepauzeerd', setup: 'Nog niet gestart',
};
/** Weericoon bij de buitentemperatuur, passend bij het weer buiten (kind uit status.weather). */
const WX = (() => {
  const S = (d, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const cloudHi = '<path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 8a3.5 3.5 0 0 0 1 7z"/>';
  const cloudLo = '<path d="M9.5 20h7.5a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 8 14.2a3 3 0 0 0 1.5 5.8z"/>';
  return {
    clear: S('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
    night: S('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
    partly: S(`<circle cx="8" cy="8" r="3"/><path d="M8 2v1.2M2 8h1.2M3.8 3.8l.9.9M12.2 3.8l-.9.9"/>${cloudLo}`),
    nightpartly: S(`<path d="M12 9.5A4.5 4.5 0 1 1 6.5 3.5a3.6 3.6 0 0 0 5.5 6z"/>${cloudLo}`),
    cloudy: S('<path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/>'),
    rain: S(`${cloudHi}<path d="M8.5 18.5l-1 2.5M12.5 18.5l-1 2.5M16.5 18.5l-1 2.5"/>`),
    snow: S(`${cloudHi}<path d="M8 19.5h.01M12 21h.01M16 19.5h.01M10 22.5h.01M14 22.5h.01"/>`, 2.6),
    fog: S('<path d="M4 8h16M3 12.5h18M5 17h14"/>'),
    thunder: S(`${cloudHi}<path d="M12.5 15.5l-2 3.5h3.5l-2 3.5"/>`),
  };
})();
const wxIcon = (k) => WX[k] || WX.cloudy;
const THERMO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.6V5a2 2 0 0 1 4 0v8.6a4 4 0 1 1-4 0z"/><path d="M12 16.5v.01"/></svg>'; // buiten, weertype onbekend
/** Buiten op tijdstip t, voor het detail-kaartje: temperatuur (dichtstbijzijnde meting, max. 1,5 uur ernaast) en weericoon.
 *  Weertype onbekend (van vóór het bijhouden)? Dan een thermometer. Geen buitentemperatuur = niets tonen. */
function outdoorAt(h, t) {
  let best = null; (h.outdoor || []).forEach((r) => { if (!best || Math.abs(r[0] - t) < Math.abs(best[0] - t)) best = r; });
  if (!best || Math.abs(best[0] - t) > 90 * 60000 || !Number.isFinite(Number(best[1]))) return '';
  let k = null; (h.weather || []).forEach((x) => { if (x.t <= t) k = x.k; });
  return `<span class="to">${k ? wxIcon(k) : THERMO_ICON}${fmt(Math.round(Number(best[1]) * 10) / 10)}</span>`;
}

// i-knopje voor uitleg (Opwarmtijd en Terugkijken).
const INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>';
const ICON = {
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 15h8m-3-2.5L15.5 15 13 17.5"/></svg>',
  away: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 12v.01M3 21h18M5 21V5a2 2 0 0 1 2-2h7.5M17 13.5V21M14 7h7m-3-3 3 3-3 3"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 11 12 3l9.5 8v10.5h-19z"/><path d="M12 10.5s2.3 2.5 2.3 4.2a2.3 2.3 0 0 1-4.6 0c0-1.7 2.3-4.2 2.3-4.2z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/></svg>',
};

let H; let schedule = {}; let saved = '{}'; let config = {}; let lastSaved = {}; let devices = [];
const todayKey = DAY_KEYS[(new Date().getDay() + 6) % 7];
const open = new Set([todayKey]);
let copyOpen = null;
let flashId = null; // nieuw blok dat even oplicht
let opening = null; // blok dat net opengaat: alleen dan de groei-animatie

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const call = (name, ...args) => new Promise((res, rej) => H[name](...args, (err, val) => (err ? rej(err) : res(val))));
const fmt = (v, unit = '°') => (v == null || Number.isNaN(Number(v)) ? '–' : `${Number(v).toFixed(1)}${unit}`);
const clone = (o) => JSON.parse(JSON.stringify(o));
const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

/** Grote temperatuur: 17 groot, ° en .6 klein ernaast. */
function bigTemp(v) {
  if (v == null || Number.isNaN(Number(v))) return '<span class="temp"><span class="i">–</span></span>';
  const [i, d] = Number(v).toFixed(1).split('.');
  return `<span class="temp"><span class="i">${i}</span><span class="r"><span class="deg">°</span><span class="d"><span class="pt">.</span>${d}</span></span></span>`;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

/** Kleuren per temperatuur: koel = mintgroen, warmer = geel/oranje. */
function tempStyle(t) {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  if (t == null) return dark ? 'background:#2c2d36;color:#9a9ba3' : 'background:#e6e6eb;color:#6c6c72';
  if (t < 16) return dark ? 'background:#1c4636;color:#6fdcae' : 'background:#d7f3e6;color:#1d6f4f';
  if (t < 18) return dark ? 'background:#5a4512;color:#f7c75a' : 'background:#fdecc0;color:#7a5306';
  if (t < 20) return dark ? 'background:#5f3612;color:#f5a560' : 'background:#fbdcbf;color:#87440d';
  return dark ? 'background:#66281a;color:#f58a6a' : 'background:#f9cbbd;color:#8e2f16';
}
/** Gedeeld palet (zelfde als de widget): laag = turquoise-groen, 16–18 = geel, 18–20 = oranje, 20+ = rood-oranje. */
const tempColor = (t) => (t < 16 ? '#45c08f' : t < 18 ? '#f7b52c' : t < 20 ? '#ee8a35' : '#e5603a');

/** Segmenten 0:00–24:00 voor een dag, met de temperatuur die van de vorige dag doorloopt. */
function segments(key) {
  const idx = DAY_KEYS.indexOf(key);
  let carry = null;
  for (let s = 1; s <= 7 && carry === null; s++) {
    const prev = schedule[DAY_KEYS[(idx - s + 7) % 7]] || [];
    if (prev.length) carry = Number(prev[prev.length - 1].temp);
  }
  const blocks = (schedule[key] || []).filter((b) => /^\d{2}:\d{2}$/.test(b.time)).slice().sort((a, b) => a.time.localeCompare(b.time));

// ---------- Weekschema ----------
function dirty() { return JSON.stringify(schedule) !== saved; }

const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

/** Lichte tint per temperatuur voor de tijdvakken. */

}

/** Tijdvakken van een dag: [{from, to, temp, idx}] (idx = null voor het stuk dat van gisteren doorloopt). */
function slots(key) {
  const list = (schedule[key] || []).map((b, idx) => ({ ...b, idx })).filter((b) => /^\d{2}:\d{2}$/.test(b.time))
    .sort((a, b) => a.time.localeCompare(b.time));
  const segs = segments(key);
  const out = [];
  if (!list.length || toMin(list[0].time) > 0) out.push({ from: 0, to: list.length ? toMin(list[0].time) : 1440, temp: segs[0] ? segs[0].temp : null, idx: null });
  list.forEach((b, n) => out.push({ from: toMin(b.time), to: n + 1 < list.length ? toMin(list[n + 1].time) : 1440, temp: Number(b.temp), idx: b.idx }));

/** Ingestelde maximumtemperatuur (of null) en wat een schema-blok daardoor echt wordt. */

    }

/** Naar vandaag: dag openklappen en ernaartoe scrollen. */

$('week').addEventListener('click', (e) => {

  // Tik op een lege plek van het open blok: weer dichtklappen.
  if (t('.slot.open .se') && !t('input, button, output')) { setEditing(null); return; }
  if ((el = t('[data-toggle]'))) {
    const k = el.dataset.toggle; open.has(k) ? open.delete(k) : open.add(k); renderWeek(); return;
  }
  if (t('[data-maxs]')) { [0, 110, 220].forEach((ms) => setTimeout(tick, ms)); return; } // 'max': foutpatroon trillen
  if ((el = t('[data-step]'))) {

    b.temp = Math.min(top, Math.max(5, Math.round((Math.min(Number(b.temp), top) + Number(el.dataset.step)) * 2) / 2));

// Tijd typen: tijdens het typen alleen onthouden. Pas als je het veld verlaat (of Enter drukt)

/** Eindtijd = begin van het volgende blok. Moet na het eigen begin en vóór het einde van dat volgende blok liggen. */
function commitEnd(inp) {

  setTimeout(() => {
    if (document.activeElement && document.activeElement.type === 'time') return;
    const list = schedule[day]; const own = list[i]; const nxt = list[next];
    if (!own || !nxt || !/^\d{2}:\d{2}$/.test(v) || v === nxt.time) { renderWeek(); return; }

// Herstel: terug naar het opgeslagen schema. Alleen het open tijdsblok klapt in; open dagen blijven open.

const clock = (ms) => `${new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })} uur`;
function dayWord(ms) {

  const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);
  if (d.toDateString() === today.toDateString()) return '';

function timeOf(ms) { const w = dayWord(ms); return `${w ? `${w} ` : ''}${clock(ms)}`; }

const pageStart = Date.now();

}

let lastStatus = null; let sliding = false;

/** Datum van een meting: vandaag/gisteren, anders '4 nov'; uit een ander jaar met jaartal ('4 nov 2025'). */
function logDate(ms) {

/** Opwarmtijd-kaart: geleerde cijfers en de laatste metingen. */

    try {
      // Schema vastleggen zoals je het nu ziet, zodat de app precies dit voorstel gebruikt.
      if (dirty() || !(await call('get', 'schedule').catch(() => null))) {
        await call('set', 'schedule', schedule); saved = JSON.stringify(schedule); renderWeek();
      }
      const st = await call('api', 'POST', '/action', { action: 'start' });
      setupState.done = true; $('sv').classList.remove('show-main');
      renderStatus(st);
    } catch (err) { H.alert(`Starten lukte niet: ${err.message || err}`); }
    setupState.starting = false;
  }
  renderSetup();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

async function onHomeyReady(Homey) {
  H = Homey;
  schedule = (await call('get', 'schedule').catch(() => null)) || {};
  if (!DAY_KEYS.some((k) => (schedule[k] || []).length)) {
    DAY_KEYS.forEach((k) => { schedule[k] = clone(k === 'sat' || k === 'sun' ? WEEKEND_BLOCKS : DEFAULT_BLOCKS); });
  }
  DAY_KEYS.forEach((k) => { schedule[k] = schedule[k] || []; });
  saved = JSON.stringify(schedule);
  config = (await call('get', 'config').catch(() => null)) || {};
  lastSaved = clone(config); // terugvallen als opslaan mislukt
  renderWeek();
  Homey.ready();
  loadStatus();
  devices = await call('api', 'GET', '/devices', null).catch(() => []);
  renderConfig(); renderSetup(); bootTile();
  // Live: de app stuurt na elke wijziging de nieuwe stand. Ophalen elke 15 s blijft als vangnet.
  if (typeof Homey.on === 'function') Homey.on('status', (st) => { lastVia = 'live'; renderStatus(st); schedulePoll(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStatus(); });
  $('refresh').addEventListener('click', () => { $('fresh').textContent = 'Ophalen…'; loadStatus(); });
  setInterval(tickFresh, 1000);
  // Wisselt het toestel tussen licht en donker terwijl de pagina open is: kleuren van het weekschema opnieuw uitrekenen.
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { renderWeek(); });
  loadHistory(); setInterval(() => { if (histDay === 0 && !document.hidden) loadHistory(); }, 5 * 60000); // vandaag elke 5 min bijwerken
}
</script>
