<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <style>
    /* Kleur = toestand van de kamer (zelfde als de statustegel in de instellingen):
       groen = rust (basis), geel = opwarmen, blauw = te koud, blauwgroen = te vochtig. Licht en donker gelijk. */
    /* #w = houder; elke pagina (.pg) is een eigen kaart, zoals een slimme stapel. */
    #w {
      --cardbg: #45c08f; --fg: #ffffff; --pill: rgba(0,0,0,.14); --solid: rgba(0,0,0,.22); --solid-text: #ffffff;
      color: var(--fg); font: 400 15px/1.35 -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; position: relative;
    }
    #w .pg {
      border-radius: 12px; padding: 14px 16px; background-color: #45c08f; position: relative; isolation: isolate; overflow: hidden;
      display: flex; flex-direction: column; gap: 8px; transition: background-color .9s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 3px 8px -3px rgba(0,0,0,.12); transform-origin: 50% 50%;
    }
    @media (prefers-color-scheme: dark) { #w .pg { box-shadow: none; } }
    #w.heat .pg { background-color: #f7b52c; }
    #w.cold .pg { background-color: #3b8cf0; }
    #w.humid .pg { background-color: #2f9fb8; }
    #w.setup .pg { background-color: #8b8f96; } /* nog niet gestart */
    #w.heat { --cardbg: #f7b52c; } #w.cold { --cardbg: #3b8cf0; } #w.humid { --cardbg: #2f9fb8; } #w.setup { --cardbg: #8b8f96; }
    /* Donkere modus: donkere tint van de toestandskleur met felle tekst in dezelfde kleur (rustiger en beter leesbaar
       dan wit op een felle kaart). Knoppen en balk volgen de tekstkleur. */
    @media (prefers-color-scheme: dark) {
      #w { --fg: #5ee3a8; --solid-text: var(--fg);
        --pill: color-mix(in srgb, var(--fg) 14%, transparent); --solid: color-mix(in srgb, var(--fg) 22%, transparent); }
      #w.heat { --fg: #ffc24a; } #w.cold { --fg: #74b6ff; } #w.humid { --fg: #5fd3ea; } #w.setup { --fg: #c5c8ce; }
      #w { --cardbg: #133a2b; } #w.heat { --cardbg: #3e2c0c; } #w.cold { --cardbg: #10294a; } #w.humid { --cardbg: #0e3340; } #w.setup { --cardbg: #2a2b2f; }
      #w .p0 { background-color: #133a2b; }
      #w.heat .p0 { background-color: #3e2c0c; } #w.cold .p0 { background-color: #10294a; }
      #w.humid .p0 { background-color: #0e3340; } #w.setup .p0 { background-color: #2a2b2f; }
      #w .p0::before { background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,0) 60%); }
      #w .p0::after { background: radial-gradient(120% 90% at 20% 30%, color-mix(in srgb, var(--fg) 22%, transparent), transparent 70%); }
    }
    /* Zachte glans. */
    #w .pg::before { content: ''; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,0) 55%, rgba(0,0,0,.05)); }
    #w .pg::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
      background: radial-gradient(120% 90% at 20% 30%, rgba(255,255,255,.28), transparent 70%); }
    #w.flash .p0::after { animation: w-flash 1.2s ease-out; }
    @keyframes w-flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #w .pg { transition: none; } #w.flash .p0::after { animation: none; } }
    /* Niet scrollen of 'meeveren' als je de widget met je vinger versleept. */
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; padding: 0 1px 6px; box-sizing: border-box; }
    #w * { box-sizing: border-box; }
    #w .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; height: 32px; flex: none; }
    #w .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--pill); font-size: 13px; font-weight: 600; white-space: nowrap; }
    #w .chip svg { width: 15px; height: 15px; }
    /* Info als gewone tekst met icoontjes, zodat het niet op knoppen lijkt. */
    #w .info { display: inline-flex; align-items: center; gap: 12px; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; }
    #w .info .mode { font-weight: 600; }
    #w .top .cost { flex: none; font-size: 13px; white-space: nowrap; opacity: .85; font-variant-numeric: tabular-nums; }
    #w .top .cost b { font-weight: 700; opacity: 1; }
    /* Kosten zijn aantikbaar: heel klein i-tje erachter, tik toont een kort ballonnetje. */
    #w .top button.cost { all: unset; flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; white-space: nowrap; opacity: .85; font-variant-numeric: tabular-nums; cursor: pointer; padding: 8px 0; margin: -8px 0; -webkit-tap-highlight-color: transparent; }
    #w .top button.cost .ci { width: 10px; height: 10px; flex: none; opacity: .7; }
    #w .top button.cost[aria-expanded="true"] .ci { color: #1f6fe5; opacity: 1; } /* open: i-tje in de selectiekleur */
    @media (prefers-color-scheme: dark) { #w .top button.cost[aria-expanded="true"] .ci { color: #3d8bff; } }
    /* .wpop.cpop: specifieker dan de regels van het golfjes-ballonnetje verderop. */
    #w .wpop.cpop { left: auto; right: 10px; max-width: 220px; }
    #w .wpop.cpop .t { white-space: normal; overflow: visible; font-size: 13px; }
    #w .top button.cost[aria-expanded="true"] { position: relative; z-index: 5; opacity: 1; } /* boven de grijze laag, zoals de golfjes */
    #w .info .it { display: inline-flex; align-items: center; gap: 3px; opacity: .8; }
    #w .info .it svg { width: 13px; height: 13px; flex: none; }
    #w .info .it.high { opacity: 1; font-weight: 700; }
    /* Wisselknop (handmatig): zelfde tekst, iets groter tikvlak, zonder knoplook */
    #w .info button.it { all: unset; display: inline-flex; align-items: center; gap: 3px; opacity: .8; cursor: pointer; padding: 6px 4px; margin: -6px -4px; -webkit-tap-highlight-color: transparent; }
    #w .info button.it.high { opacity: 1; font-weight: 700; }
    #w .info button.it svg { width: 13px; height: 13px; flex: none; }
    /* Wisselende waarde (handmatig): twee waarden op één plek, zachte overgang */
    #w .info button.rot { display: inline-grid; }
    #w .rot > span { grid-area: 1 / 1; display: inline-flex; align-items: center; gap: 3px; transition: opacity .45s ease, transform .45s ease; }
    #w .rot > .v2 { opacity: 0; transform: translateY(6px); }
    #w .rot.alt > .v1 { opacity: 0; transform: translateY(-6px); }
    #w .rot.alt > .v2 { opacity: 1; transform: none; }
    #w .rot > .high { font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { #w .rot > span { transition: none; transform: none !important; } }
    /* Golfjes los boven het getal, zodat ze de rij niet verschuiven. */
    /* Golfjes naast de huidige temperatuur: 'het wordt warmer'. */
    #w .tw { position: relative; display: inline-flex; align-items: center; }
    /* Drie golfjes staan er altijd (gedimd). Bij verwarmen vullen ze zich: 1, 2 of 3, naar hoe lang het opwarmen
       nog duurt (zie heatLevel). Nog niet bevestigd door de thermostaat: de gevulde golfjes knipperen. */
    #w .waves { display: inline-flex; width: 20px; height: 26px; margin-left: 8px; align-self: flex-end; margin-bottom: 2px; pointer-events: none; }
    /* Golfjes zijn aan te tikken voor uitleg; ruim tikvlak zonder dat de golfjes verschuiven. */
    #w button.wbtn { all: unset; display: inline-flex; align-self: flex-end; padding: 8px 10px 4px 0; margin: -8px -10px -4px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* Uitleg bij de golfjes: kaart iets gedimd, golfjes blijven erboven, een ballonnetje wijst ernaar. */
    #w .wscrim { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.22); cursor: pointer; }
    #w.wexp-on .wbtn { position: relative; z-index: 5; }
    #w .wpop { position: absolute; left: 10px; width: max-content; max-width: calc(100% - 20px); box-sizing: border-box; z-index: 6; background: #fff; color: #17171a; border-radius: 12px; padding: 7px 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,.22); cursor: pointer; }
    #w .wpop::before { content: ''; position: absolute; top: -6px; left: var(--ax, 40px); width: 12px; height: 12px; margin-left: -6px; background: inherit; transform: rotate(45deg); border-radius: 2px; }
    #w .wpop .t { font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #w .wpop .n { font-size: 12px; opacity: .65; margin-top: 1px; white-space: nowrap; }
    #w .wpop .t b { font-weight: 700; }
    #w .wpop .lg { display: flex; gap: 2px; margin: 5px -6px 0; }
    #w .wpop .lg > span { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 8px; font-size: 12.5px; color: #3a3d42; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #w .wpop .lg > span.cur { background: #ececf0; color: #17171a; font-weight: 700; } /* neutraal: past bij elke kaartkleur */
    #w .wpop .lg .waves { margin: 0; align-self: center; width: 12px; height: 16px; color: #17171a; }
    #w .wpop .lg .waves svg { width: 12px; height: 16px; }
    #w .wpop .lg .waves path { opacity: .22; } /* duidelijk verschil tussen aan en uit */
    #w .wpop .lg .waves.l1 .w1, #w .wpop .lg .waves.l2 .w1, #w .wpop .lg .waves.l2 .w2, #w .wpop .lg .waves.l3 path { opacity: 1; }
    #w .wpop.enter, #w .wscrim.enter { animation: wexp-in .18s ease; }
    @keyframes wexp-in { from { opacity: 0; } }
    @media (prefers-color-scheme: dark) { #w .wpop { background: #2a2b2f; color: #fff; } #w .wpop .lg > span { color: #d5d7db; } #w .wpop .lg > span.cur { background: rgba(255,255,255,.14); color: #fff; } #w .wpop .lg .waves { color: #fff; } }
    @media (prefers-reduced-motion: reduce) { #w .wpop.enter, #w .wscrim.enter { animation: none; } }
    #w .waves path { opacity: .35; transition: opacity .5s ease; }
    #w .waves.l1 .w1, #w .waves.l2 .w1, #w .waves.l2 .w2, #w .waves.l3 path { opacity: 1; }
    /* Nog niet bevestigd: de gevulde golfjes knipperen tegelijk, aan/uit zonder overgang. */
    #w .waves.blink.l1 .w1, #w .waves.blink.l2 .w1, #w .waves.blink.l2 .w2, #w .waves.blink.l3 path { transition: none; animation: w-blink 1s steps(1, end) infinite; }
    @keyframes w-blink { 0% { opacity: 1; } 50% { opacity: .2; } }
    #w.setup .waves { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { #w .waves.blink path { animation: none !important; } }
    #w .waves svg { width: 20px; height: 26px; }
    /* In het kaartje bij de tijdlijn: zelfde 1, 2 of 3 golfjes als bovenaan (opwarmtijd vanaf dat moment). */
    #w .wtip .waves { margin: 0; width: auto; height: auto; align-self: auto; }
    #w .mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 56px; flex: none; }
    #w .temp { display: inline-flex; align-items: flex-start; font-weight: 600; line-height: .9; letter-spacing: -.03em; }
    #w .temp .i { font-size: 58px; }
    #w .temp .r { display: flex; flex-direction: column; justify-content: space-between; height: 52px; margin-left: 7px; align-items: flex-start; }
    #w .temp .pt { position: absolute; right: 100%; bottom: 0; }
    #w .temp .deg { font-size: 26px; line-height: 1; }
    #w .temp .d { font-size: 23px; line-height: 1; position: relative; align-self: flex-start; }
    #w .ctrl { display: flex; align-items: center; gap: 2px; }
    #w button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px; background: var(--pill); color: inherit; font: inherit; font-weight: 600; transition: transform .06s; }
    #w button:active { transform: scale(.94); }
    #w .ctrl button { width: 40px; height: 40px; padding: 0; flex: none; }
    #w .ctrl button svg { width: 18px; height: 18px; display: block; }
    /* Op het maximum: + wordt een rondje met 'max' (tikken doet niets). */
    #w .ctrl .maxb { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; padding: 0;
      background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fg) 55%, transparent); }
    #w .ctrl .val { position: relative; width: 60px; text-align: center; }
    #w .ctrl output { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    /* Ruimte onder de grote temperatuur (zone van de thermostaat in Homey) */
    #w .room { font-size: 18px; font-weight: 600; line-height: 22px; height: 22px; margin-top: -4px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #w .sub { display: flex; align-items: center; gap: 6px; font-size: 14px; height: 20px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #w .sub svg { width: 17px; height: 17px; flex: none; }
    #w .bar { position: relative; display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: 2px; }
    #w .bar i { display: block; height: 100%; }
    /* Handmatige periode: omlijning om dat stuk van de balk, met afgeronde hoeken (tekstkleur: zwart in lichte modus). */
    #w .barwrap .manual { position: absolute; top: -2px; height: 14px; margin-left: -2px; padding: 0; box-sizing: content-box; /* binnenrand = balkrand; placeManual zet left/width in px */
      border: 2px solid currentColor; border-radius: 5px; pointer-events: none; } /* iets scherper */
    /* Open kant: de periode loopt door na middernacht (of tot je het schema hervat), of begon gisteren. */
    #w .barwrap .manual.or { border-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    #w .barwrap .manual.ol { border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
    #w .barwrap { position: relative; height: 12px; flex: none; }
    /* Nu-streepje verticaal gecentreerd op de balk, horizontaal precies op het tijdstip. */
    /* Nu-streepje met een randje in de kaartkleur: lijkt los te staan en valt óver het kader van de handmatige periode. */
    #w .now { position: absolute; top: -1px; width: 3px; height: 16px; border-radius: 2px; background: currentColor; transform: translateX(-1.5px); z-index: 2; box-shadow: 0 0 0 2px var(--cardbg); }
    #w .ticks { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; height: 14px; opacity: .7; margin-top: -2px; flex: none; }
    #w .resume { flex: none; white-space: nowrap; height: 32px; padding: 0 12px; font-size: 14px; background: var(--solid); color: var(--solid-text); }
    #w .resume svg { width: 16px; height: 16px; }
    #w .err { font-size: 13px; }
    /* Twee pagina's (alleen dashboard): nu en verloop van vandaag. Swipen of op de puntjes tikken. */
    #w { touch-action: pan-y; }
    /* Schuifbaan: beide pagina's naast elkaar; de inhoud volgt je vinger tot aan de rand van de kaart. */
    #w .vp { overflow: visible; position: relative; isolation: isolate; border-radius: 16px; }
    /* Tijdens het vegen is het kader de lijst: kaarten wisselen erbinnen en vallen er niet overheen. */
    #w.stacking .vp { overflow: hidden; }
    /* Kader achter de kaarten (zoals een slimme stapel): tijdens vegen zichtbaar en groter dan de kaart, daarna weer weg. */
    #w .stackframe { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: -1;
      /* Glazig en iets afwijkend van de achtergrond: grijze tint, lichte rand, zachte schaduw. */
      background: linear-gradient(180deg, rgba(120,120,128,.22), rgba(120,120,128,.30));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
      -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
      opacity: 0; transform: scale(.94); transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1); }
    @media (prefers-color-scheme: dark) { #w .stackframe { background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.10)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); } }
    #w.stacking .stackframe { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { #w .stackframe { transition: opacity .2s; transform: none; } }
    #w .track { position: relative; }
    #w .track > .p1 { position: absolute; top: 0; left: 0; right: 0; }
    #w .track > .pg { will-change: transform; }
    #w .chart { display: block; width: 100%; flex: none; }
    /* Details bij vasthouden: lijn, stip en kaartje */
    #w .chart .scrub line { stroke: currentColor; stroke-width: 1.2; }
    #w .chart .scrub circle { fill: #fff; stroke: currentColor; stroke-width: 2; }
    #w .wtip { position: absolute; top: 6px; transform: translateX(-50%); pointer-events: none; z-index: 3; white-space: nowrap; width: max-content; /* niet laten samenknijpen aan de rand */
      background: #17171a; color: #fff; border-radius: 10px; padding: 5px 10px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    #w .wtip .tt { font-size: 11px; opacity: .7; text-align: center; }
    #w .wtip .tv { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
    #w .wtip .tr { display: flex; gap: 10px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    #w .wtip span { display: inline-flex; align-items: center; gap: 3px; }
    #w .wtip svg { width: 13px; height: 13px; flex: none; } #w .wtip .tv svg { width: 15px; height: 18px; opacity: .8; }
    @media (prefers-color-scheme: dark) { #w .wtip { background: #f5f5f5; color: #17171a; } #w .chart .scrub circle { fill: #22232b; } }
    /* Verloopkaart: wit (donker: donkergrijs), zelfde rustige kleuren als het verloop in de instellingen */
    #w .track > .p1 { background-color: #ffffff; color: #17171a; }
    #w .p1::before, #w .p1::after { display: none; }
    #w .chart .g { stroke: #ecebe8; }
    #w .chart .l { fill: #9a9aa0; font-size: 10px; }
    #w .chart .heat { fill: #fbe3a6; opacity: .75; }
    #w .chart .in { stroke: #17171a; }
    #w .chart .sp { stroke: #45c08f; }
    #w .chart .b-schedule { fill: #d7f3e6; } #w .chart .b-manual { fill: #f7b52c; } #w .chart .b-away { fill: #8b8f96; } #w .chart .b-off { fill: #c9cbd1; }
    #w .chart .i-schedule { stroke: #1d6f4f; } #w .chart .i-manual { stroke: #4a3000; } #w .chart .i-away, #w .chart .i-off { stroke: #fff; }
    @media (prefers-color-scheme: dark) {
      #w .track > .p1 { background-color: #22232b; color: #f5f5f5; } /* zelfde blauwgrijs als de apparaattegels in Homey */
      #w .chart .g { stroke: #3a3b40; } #w .chart .in { stroke: #f5f5f5; }
      #w .chart .heat { fill: rgba(247,181,44,.28); opacity: 1; }
      #w .chart .b-schedule { fill: #1c4636; } #w .chart .b-away { fill: #6b6f76; } #w .chart .b-off { fill: #4a4c52; }
      #w .chart .i-schedule { stroke: #6fdcae; }
    }

    /* Op de instellingenpagina dezelfde ronding als de andere kaarten daar */
    .in-settings #w .pg { border-radius: 20px; padding: 16px; }
    /* Alleen op de instellingenpagina: Afwezig en Pauzeren in de tegel */
    #w .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; flex: none; }
    #w .acts button { height: 42px; padding: 0 8px; font-size: 14.5px; white-space: nowrap; min-width: 0; }
    #w .acts button svg { width: 17px; height: 17px; flex: none; }
    #w button.busy { opacity: .7; pointer-events: none; animation: w-pulse 1s ease-in-out infinite; }
    @keyframes w-pulse { 50% { opacity: .45; } }
    #w .right { display: inline-flex; align-items: center; gap: 6px; }
    /* Hoe lang geldt de handmatige stand? Schuifbalk, ∞ aan het eind.
       Neemt precies de plek van regel + dagbalk in, zodat de widget niet verspringt. */
    /* Alleen handje + tekst + potloodje is aan te tikken, niet de lege ruimte ernaast (tikvlak iets ruimer dan de tekst). */
    #w button.sub { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: 14px; height: 32px; flex: none;
      align-self: flex-start; max-width: calc(100% + 16px); padding: 0 8px; margin: -6px -8px; border-radius: 10px;
      white-space: nowrap; overflow: hidden; cursor: pointer; color: inherit; }
    #w button.sub .cd { font-variant-numeric: tabular-nums; opacity: .75; }
    #w button.sub .edit { width: 15px; height: 15px; opacity: .75; }
    #w .dur { height: 60px; flex: none; display: flex; flex-direction: column; gap: 4px; }
    /* Dashboard: de keuzes schuiven als een laatje van onderen over de dagbalk; die blijft liggen en dimt. */
    #w .zone { position: relative; flex: none; display: flex; flex-direction: column; overflow: hidden; margin: -3px 0; padding: 3px 0; }
    #w .zone > .rowl { display: flex; flex-direction: column; gap: 8px; }
    #w .zone > .rowl > :not(.sub) { transition: opacity .3s ease; }
    #w .zone.open > .rowl > :not(.sub) { opacity: 0; pointer-events: none; } /* balk vervaagt helemaal: geen eigen vlak nodig onder de knoppen */
    #w .zone.fresh > .rowl > :not(.sub) { animation: w-dim .3s ease; }

  else if (paused) sub = '<span>Schema staat stil</span>';
  else if (s.mode === 'away') sub = `${ICON_ACT.away}<span>Tot iemand thuiskomt</span>`; // niet het volgende schema-moment: dat geldt nu niet
  else if (s.mode === 'preheat') sub = `${ICON.flame}<span>Voorverwarmen voor ${esc(nextAt(s))}</span>`;
  else if (s.nextBlock && nextBlockAt(s)) sub = `<span>${esc(cap(whenAt(nextBlockAt(s))))} → ${deg(s.nextBlock.temp)}</span>`;
  else sub = '';
  let subHtml;
  if (durOpen && !IN_SETTINGS) {
    const dd = curDur(s); const same = s.mode === 'manual' && s.override && chosenDur == null;
    const lb = durLabel(s, dd, same ? s.override.until : untilOf(s, dd));
    subHtml = `<button class="sub" data-durclose aria-label="Klaar met kiezen">${ICON.hand}<span class="dl">${esc(lb.t)}</span><span class="cd">${esc(lb.cd)}</span></button>`;
  } else subHtml = manual ? `<button class="sub" data-duropen aria-label="Duur wijzigen">${sub}</button>` : `<div class="sub">${sub}</div>`;
  const waiting = heating && (pending == null) && s.targetConfirmed === false;
  clearTimeout(confirmPoll); if (waiting) confirmPoll = setTimeout(load, 3000); // wacht op bevestiging: vaker kijken
  const p0 = frame(w);
  p0.innerHTML = `
    <div class="top">
      <span class="info">
        <span class="mode">${esc(MODES[s.mode] || s.mode)}</span>
        ${infoItems(s)}
      </span>
      ${s.mode === 'manual' ? `<button class="resume" data-act="resume">${ICON.cal}Hervat schema</button>`
        : paused && !IN_SETTINGS ? `<button class="resume" data-act="enable">${ICON_ACT.play}Hervat</button>` : ''}
    </div>
    <div class="mid">
      <span class="tw">${bigTemp(s.indoor)}<button class="wbtn" data-waveinfo aria-label="Wat betekenen de golfjes?"><span class="waves${heatLevel(target, s.indoor, heating, s.learned)}${heating && (pending != null || s.targetConfirmed === false) ? ' blink' : ''}" aria-hidden="true">${ICON.waves}</span></button></span>
      ${setup || paused ? '' : `<div class="ctrl">
        <button data-d="-0.5" aria-label="Kouder">${ICON.minus}</button>
        <span class="val"><output aria-label="Ingesteld">${fmt(target)}</output></span>
        ${s.maxTemp != null && target >= s.maxTemp ? '<button class="maxb" data-max aria-label="Maximumtemperatuur bereikt">max</button>' : `<button data-d="0.5" aria-label="Warmer">${ICON.plus}</button>`}
      </div>`}
    </div>
    ${s.room ? `<div class="room">${esc(s.room)}</div>` : ''}
    ${IN_SETTINGS ? (durOpen ? durPanel(s) : subHtml)
    : `<div class="zone${durOpen ? ' open' : ''}${durOpen && enterPanel ? ' fresh' : ''}"><div class="rowl">${subHtml}${todayBar(data.schedule || {}, s)}</div>${durOpen ? durPanel(s) : ''}</div>`}
    ${durOpen && IN_SETTINGS ? '' : settingsActions(s)}
    ${waveInfo && !setup ? waveInfoPanel(s, target, heating, heating && (pending != null || s.targetConfirmed === false)) : ''}`;
  renderChart();
  placeWaveInfo(p0);
  placeManual();
  if (enterRow && !durOpen) { w.querySelectorAll('.sub, .barwrap, .ticks').forEach((el) => el.classList.add('enter')); enterRow = false; }
  setTimeout(fitHeight, 0);
}

/** Uitleg bij de golfjes: ballonnetje met wat ze nu betekenen en hoe ze tellen. */
let waveInfo = false; let waveTimer = null; let waveEnter = false; // alleen bij openen invagen, niet bij elke verversing
function waveInfoPanel(s, target, heating, waiting) {
  const lvl = heatLevel(target, s.indoor, heating, s.learned).trim();
  const min = heating ? heatMinutes(target, s.indoor, s.learned) : null;
  // Zo kort mogelijk: niet aan het verwarmen = één regel; wel = waarde + legenda met wat de golfjes tellen.
  let line; let rows = null; let note = '';
  // Of de cv echt brandt beslist de thermostaat (met eigen marge); daarom niets over 'uit' zeggen, alleen hoe dicht we erbij zitten.
  if (!heating) line = s.indoor != null && target != null && s.indoor < target ? '<b>Bijna op temperatuur</b>' : '<b>Op temperatuur</b>';
  else if (waiting) line = `Wacht tot de thermostaat <b>${fmt(target)}</b> overneemt`;
  else {
    // Kloktijd zegt meer dan een duur. Nog weinig metingen? Dan eerlijk melden dat het een schatting is.
    line = `Warm rond <b>${clock(Date.now() + min * 60000)}</b>`;
    rows = [['l1', '&lt;30 min'], ['l2', '30–90 min'], ['l3', '&gt;1½ uur']];
    if (stillLearning(s.learned)) note = `Nog aan het leren · ${Math.min(s.learned ? s.learned.samples : 0, MIN_SAMPLES)} van ${MIN_SAMPLES} metingen`;
  }
  const enter = waveEnter ? ' enter' : ''; waveEnter = false;
  return `<div class="wscrim${enter}" data-waveclose></div>
  <div class="wpop${enter}" data-waveclose role="dialog" aria-label="Uitleg golfjes">
    <div class="t">${line}</div>
    ${note ? `<div class="n">${note}</div>` : ''}
    ${rows ? `<div class="lg">${rows.map(([c, t]) => `<span class="${c === lvl ? 'cur' : ''}"><span class="waves ${c}">${ICON.waves}</span>${t}</span>`).join('')}</div>` : ''}
  </div>`;
}
/** Ballonnetje net onder de golfjes zetten, met het pijltje erop gericht. */
function placeWaveInfo(p0) {
  const pop = p0.querySelector('.wpop'); const wv = p0.querySelector('.wbtn .waves');
  document.getElementById('w').classList.toggle('wexp-on', !!pop);
  if (!pop || !wv) return;
  const pr = p0.getBoundingClientRect(); const r = wv.getBoundingClientRect();
  let top = r.bottom - pr.top + 10; const h = pop.offsetHeight;
  if (top + h > pr.height - 8) top = Math.max(8, pr.height - h - 8);
  const cx = r.left + r.width / 2 - pr.left; // midden van de golfjes
  const left = Math.max(10, Math.min(cx - 34, pr.width - pop.offsetWidth - 10));
  pop.style.top = `${top}px`; pop.style.left = `${left}px`;
  pop.style.setProperty('--ax', `${cx - left}px`);
}

/** Kader precies op de stukken van de balk: de tussenruimtes (2px) verschuiven de grenzen t.o.v. percentages. */
function placeManual() {
  const box = document.querySelector('#w .barwrap .manual'); if (!box) return;
  const wrap = box.parentElement.getBoundingClientRect();
  const xOf = (m) => {
    for (const seg of document.querySelectorAll('#w .bar i')) {
      const a = Number(seg.dataset.a); const b = Number(seg.dataset.b);
      if (m >= a && m <= b) { const r = seg.getBoundingClientRect(); return r.left - wrap.left + ((m - a) / (b - a)) * r.width; }
    }
    return (m / 1440) * wrap.width;
  };
  const x1 = xOf(Number(box.dataset.from)); const x2 = xOf(Number(box.dataset.to));
  box.style.left = `${x1}px`; box.style.width = `${Math.max(0, x2 - x1)}px`; // margin-left -2px + rand 2px: binnenkant van de rand ligt op x1..x2
}
window.addEventListener('resize', placeManual);

// Widgethoogte = gemeten inhoud, zodat er niets wordt afgesneden en er niets te scrollen valt.
let lastHeight = 226;
function fitHeight() {
  const h = Math.ceil(document.getElementById('w').getBoundingClientRect().height) + 6; // + ruimte voor de schaduw
  if (!H || !h) return;
  if (Math.abs(h - lastHeight) > 1 && typeof H.setHeight === 'function') {
    lastHeight = h; Promise.resolve(H.setHeight(h)).catch(() => {});
  }
}
// Na een actie nog twee keer kijken: de thermostaat bevestigt een wijziging pas na een paar seconden.
function refreshSoon() { setTimeout(load, 4000); setTimeout(load, 12000); }
async function load() {
  try { data = await H.api('GET', '/status'); } catch (e) { /* volgende poging */ }
  loaded = true;
  render();
}

// Swipen over de hele widget: naar links = verloop, naar rechts = terug (niet op de schuifbalk).
// Vasthouden op het verloop: lijn, stip en kaartje met de waarden op dat moment.
/** Stand op tijdstip t: 'manual' = met de hand ingesteld (handje), anders schema (kalender). */
function modeAt(h, t) { let r = null; (h.modes || []).forEach((x) => { if (x.t <= t) r = x.m; }); return r; }
function wScrub(clientX) {
  const m = wModel; const svg = document.querySelector('#w .p1 .chart'); if (!m || !svg || !m.h.indoor.length) return;
  const r = svg.getBoundingClientRect(); const k = m.W / r.width;
  const px = Math.max(m.X0, Math.min(m.W, (clientX - r.left) * k));
  const t = m.h.start + ((px - m.X0) / (m.W - m.X0)) * (m.h.end - m.h.start);
  const row = m.h.indoor.reduce((a, b) => (Math.abs(b[0] - t) < Math.abs(a[0] - t) ? b : a));
  const v = row[1]; const sp = m.tgt.get(Math.round(row[0] / m.step)); const hum = m.hum.get(Math.round(row[0] / m.step));
  const out = m.out.get(Math.round(row[0] / m.step));
  const cx = m.x(Math.min(row[0] + m.step / 2, m.h.now)); const cy = m.y(v);
  const g = svg.querySelector('.scrub'); g.style.display = '';
  g.querySelector('line').setAttribute('x1', cx); g.querySelector('line').setAttribute('x2', cx);
  g.querySelector('circle').setAttribute('cx', cx); g.querySelector('circle').setAttribute('cy', cy);
  const tip = document.querySelector('#w .p1 .wtip'); tip.hidden = false;
  tip.innerHTML = `<div class="tt">${new Date(row[0]).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}</div>
    <div class="tv">${fmt(v)}${sp != null && sp > v + 0.2 ? `<span class="waves${heatLevel(sp, v, true, data && data.status && data.status.learned ? { ...data.status.learned, heatingNow: true } : null)}">${ICON.waves}</span>` : ''}</div>
    <div class="tr">${hum != null ? `<span>${ICON.drop}${Math.round(hum)}%</span>` : ''}${sp != null ? `<span>${modeAt(m.h, row[0]) === 'manual' ? ICON.hand : ICON.cal}${fmt(sp)}</span>` : ''}</div>`;
  const p1 = document.querySelector('#w .p1'); const pr = p1.getBoundingClientRect();
  const half = tip.offsetWidth / 2; const at = r.left - pr.left + cx / k;
  tip.style.left = `${Math.max(half + 6, Math.min(pr.width - half - 6, at))}px`;
}
let wHide = null;
function wScrubEnd() {
  const g = document.querySelector('#w .p1 .chart .scrub'); if (g) g.style.display = 'none';
  const tip = document.querySelector('#w .p1 .wtip'); if (tip) tip.hidden = true;
}

// De inhoud volgt je vinger; loslaten = naar de dichtstbijzijnde pagina. Aan de randen wat weerstand.
document.addEventListener('touchstart', (e) => {
  if (IN_SETTINGS || !document.querySelector('#w .track')) return;
  const t = e.touches[0]; drag = { x: t.clientX, y: t.clientY, dx: 0, mode: null };
  // Op het verloop even stilhouden = details bekijken (in plaats van vegen).
  drag.onChart = page === 1 && !!e.target.closest('.p1 .chart');
  if (drag.onChart) {
    clearTimeout(wHide);
    drag.hold = setTimeout(() => {
      if (!drag || drag.mode) return;
      drag.mode = 'scrub'; wScrub(drag.x);
    }, 180);
  }
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!drag) return;
  const t = e.touches[0]; const dx = t.clientX - drag.x; const dy = t.clientY - drag.y;
  if (drag.mode === 'scrub') { if (e.cancelable) e.preventDefault(); wScrub(t.clientX); return; }
  // Op de grafiek: zolang de richting nog niet vastligt niet laten scrollen, anders neemt Homey het gebaar over.
  if (drag.onChart && !drag.mode && Math.abs(dx) >= Math.abs(dy) && e.cancelable) e.preventDefault();
  if (!drag.mode && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
    clearTimeout(drag.hold);
    // Snel opzij = vegen naar de andere kaart; eerst even vasthouden (zie touchstart) = langs de tijd schuiven.
    drag.mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    if (drag.mode === 'h' && (!hist || Date.now() - histAt > 5 * 60000)) loadHist();
  }
  if (drag.mode !== 'h') return;
  if (e.cancelable) e.preventDefault();
  drag.dx = dx; // eindeloos: geen rand, dus geen weerstand
  if (!drag.lifted) { drag.lifted = true; lift(); scaleNow = stackScale(); } // kader verschijnt, kaarten iets kleiner
  place(drag.dx, false);
}, { passive: false });
function endDrag() {
  if (!drag) return; const { mode, dx, x, onChart } = drag; clearTimeout(drag.hold); drag = null;
  if (mode === 'scrub') { clearTimeout(wHide); wHide = setTimeout(wScrubEnd, 3000); suppressClick = true; setTimeout(() => { suppressClick = false; }, 350); return; }
  if (!mode && onChart) { clearTimeout(wHide); wScrub(x); wHide = setTimeout(wScrubEnd, 3000); return; } // tik op het verloop: details even tonen
  if (mode !== 'h') return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
  const vp = document.querySelector('#w .vp'); const width = vp ? vp.offsetWidth : 300;
  if (Math.abs(dx) > width * 0.5) { flip(dx < 0 ? -1 : 1); return; } // pas voorbij de helft: andere kaart landt
  place(0, true, dx > 0 ? -1 : 1); settle(1000); // terugveren, na 1 s weer groot
}
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);


async function sendTemp() {
  clearTimeout(sendTimer); sendTimer = null;
  const temp = pending; const duration = chosenDur;
  try {
    data = await H.api('POST', '/action', duration != null ? { action: 'setTemp', temp, duration } : { action: 'setTemp', temp });
  } catch (err) { console.error(err); }
  pending = null; chosenDur = null; touched = false; render(); refreshSoon();
}

document.addEventListener('click', async (e) => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; } // net geveegd: geen knop laten afgaan
  if (e.target.closest('[data-duropen]')) { if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback(); openDur(); render(); return; }
  if (e.target.closest('[data-durclose]')) { closeDur(); return; }
  if (e.target.closest('[data-waveclose]')) { clearTimeout(waveTimer); waveInfo = false; render(); return; }
  if (e.target.closest('[data-costclose]')) { clearTimeout(costTimer); costInfo = false; renderChart(); return; }
  if (e.target.closest('[data-costinfo]')) {
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    costInfo = !costInfo; renderChart();
    clearTimeout(costTimer); if (costInfo) costTimer = setTimeout(() => { costInfo = false; renderChart(); }, 8000); // vanzelf weer dicht
    return;
  }
  if (e.target.closest('[data-waveinfo]')) {
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    waveInfo = true; waveEnter = true; render();
    clearTimeout(waveTimer); waveTimer = setTimeout(() => { waveInfo = false; render(); }, 10000); // vanzelf weer dicht
    return;
  }
  if (e.target.closest('[data-swap]')) {
    swapInfo(); startRotate(); // meteen wisselen, daarna weer om de paar seconden
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    return;
  }
  const durBtn = e.target.closest('[data-dur]');
  if (durBtn && data && data.status) {
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    const v = durBtn.dataset.dur; const d = v === 'next' || v === 'manual' ? v : Number(v);
    showDur(durBtn.closest('.dur'), d);
    commitDur(d);
    return;
  }
  if (e.target.closest('[data-max]')) {
    // Foutpatroon: drie snelle tikjes (dashboard via Homey, instellingen via de schakelaar-truc).
    [0, 110, 220].forEach((ms) => setTimeout(stepTick, ms));
    return;
  }
  const step = e.target.closest('[data-d]');
  if (step && data && data.status) {
    stepTick(); // tikje per stap
    const base = pending != null ? pending : data.status.thermostatTarget;
    const top = data.status.maxTemp != null ? data.status.maxTemp : 28; // niet boven de maximumtemperatuur
    pending = Math.min(top, Math.max(5, Math.round((base + Number(step.dataset.d)) * 2) / 2));
    openDur(); // meteen vragen hoe lang, maar zonder keuze geldt de standaard
    render();
    // Even wachten zodat meerdere tikken één wijziging worden.
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendTemp, 1200);
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act && !act.classList.contains('busy')) {
    // Meteen laten zien dat er iets gebeurt; de Homey bevestigt een paar seconden later.
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    act.classList.add('busy');
    act.textContent = 'Bezig…';
    if (act.dataset.act === 'resume' && data && data.status) {
      const st = data.status;
      const t = scheduledNow(data.schedule || {});
      data.status = { ...st, mode: 'schedule', override: null, thermostatTarget: t != null ? t : st.thermostatTarget };
      setTimeout(render, 250);
    }
    try { data = await H.api('POST', '/action', { action: act.dataset.act }); } catch (err) { console.error(err); }
    render(); refreshSoon();
  }
});

function onHomeyReady(Homey) {
  H = Homey;
  // Meteen de hoogte van de skeleton doorgeven: die is gelijk aan de geladen widget.
  const sk = Math.ceil(document.getElementById('w').getBoundingClientRect().height);
  lastHeight = sk ? sk + 6 : lastHeight; // + 6: zelfde schaduwruimte als fitHeight, anders springt hij na het laden
  Homey.ready({ height: lastHeight });
  load();
  if (!IN_SETTINGS) setTimeout(loadHist, 1500); // verloop alvast klaarzetten, zodat de tweede kaart gevuld binnenschuift
  // Live status: een melding van een oudere ronde (van vóór je laatste keuze) negeren, anders springt de widget even terug.
  if (typeof Homey.on === 'function') Homey.on('status', (st) => { if (data) { if (data.status && st && st.updatedAt < data.status.updatedAt) return; data.status = st; if (pending == null) render(); } else load(); });
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(render, 60000); // nu-streepje laten meeschuiven
}
</script>
