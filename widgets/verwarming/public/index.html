<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <style>
    #w {
      --heat: linear-gradient(160deg, #f3b25f, #e58a2c); --idle: linear-gradient(160deg, #cfe3e4, #b7d3d6);
      --t-heat: #3a1f02; --t-idle: #0f3a3d; --pill: rgba(0,0,0,.09); --solid: #3a1f02; --solid-text: #f6c27a;
      border-radius: 12px; padding: 14px 16px 14px; background: var(--idle); color: var(--t-idle);
      font: 400 15px/1.35 -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
      display: flex; flex-direction: column; gap: 8px; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    #w { box-sizing: border-box; position: relative; isolation: isolate; overflow: hidden; transition: color .9s ease; }
    #w::before { content: ''; position: absolute; inset: 0; z-index: -2; background: var(--heat); opacity: 0; transition: opacity .9s ease; }
    #w.heat::before { opacity: 1; }
    #w.heat { color: var(--t-heat); }
    #w::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
      background: radial-gradient(120% 90% at 20% 30%, rgba(255,255,255,.28), transparent 70%); }
    #w.flash::after { animation: w-flash 1.2s ease-out; }
    @keyframes w-flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #w, #w::before { transition: none; } #w.flash::after { animation: none; } }
    @media (prefers-color-scheme: dark) {
      #w { --heat: linear-gradient(160deg, #6b4210, #4a2c08); --idle: linear-gradient(160deg, #163b3f, #0e2a2e);
        --t-heat: #f6b45a; --t-idle: #5fd0c6; --pill: rgba(255,255,255,.12); --solid: #f2a23a; --solid-text: #1d1203; }
    }
    /* Niet scrollen of 'meeveren' als je de widget met je vinger versleept. */
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; }
    #w * { box-sizing: border-box; }
    #w .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; height: 32px; flex: none; }
    #w .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--pill); font-size: 13px; font-weight: 600; white-space: nowrap; }
    #w .chip svg { width: 15px; height: 15px; }
    #w .mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 56px; flex: none; }
    #w .temp { display: inline-flex; align-items: flex-start; font-weight: 600; line-height: .9; letter-spacing: -.03em; }
    #w .temp .i { font-size: 58px; }
    #w .temp .r { display: flex; flex-direction: column; justify-content: space-between; height: 52px; margin-left: 7px; align-items: flex-start; }
    #w .temp .pt { position: absolute; right: 100%; bottom: 0; }
    #w .temp .deg { font-size: 26px; line-height: 1; }
    #w .temp .d { font-size: 23px; line-height: 1; position: relative; align-self: flex-start; }
    #w .ctrl { display: flex; align-items: center; gap: 6px; }
    #w button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px; background: var(--pill); color: inherit; font: inherit; font-weight: 600; transition: transform .06s; }
    #w button:active { transform: scale(.94); }
    #w .ctrl button { width: 40px; height: 40px; font-size: 22px; }
    #w .ctrl output { min-width: 56px; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #w .sub { display: flex; align-items: center; gap: 6px; font-size: 14px; height: 20px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #w .sub svg { width: 17px; height: 17px; flex: none; }
    #w .bar { position: relative; display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 1px; margin-top: 2px; }
    #w .bar i { display: block; height: 100%; }
    #w .barwrap { position: relative; height: 12px; flex: none; }
    #w .now { position: absolute; top: -3px; width: 3px; height: 16px; border-radius: 2px; background: currentColor; transform: translateX(-1px); }
    #w .ticks { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; height: 14px; opacity: .7; margin-top: -2px; flex: none; }
    #w .resume { height: 32px; padding: 0 12px; font-size: 14px; background: var(--solid); color: var(--solid-text); }
    #w .resume svg { width: 16px; height: 16px; }
    #w .err { font-size: 13px; }
    #w button.busy { opacity: .7; pointer-events: none; animation: w-pulse 1s ease-in-out infinite; }
    @keyframes w-pulse { 50% { opacity: .45; } }
    #w .right { display: inline-flex; align-items: center; gap: 6px; }
    /* Hoe lang geldt de handmatige stand? Schuifbalk zoals in de tado-app, ∞ aan het eind.
       Neemt precies de plek van regel + dagbalk in, zodat de widget niet verspringt. */
    #w button.sub { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: 14px; height: 20px; flex: none;
      white-space: nowrap; overflow: hidden; cursor: pointer; color: inherit; }
    #w button.sub .cd { font-variant-numeric: tabular-nums; opacity: .75; }
    #w button.sub .edit { width: 15px; height: 15px; opacity: .75; }
    #w .dur { height: 60px; flex: none; display: flex; flex-direction: column; gap: 8px; animation: w-in .25s ease-out; }
    #w .dur .q { display: flex; align-items: center; gap: 8px; height: 22px; font-size: 14px; white-space: nowrap; }
    #w .dur .q b { font-weight: 600; }
    #w .dur .q .cd { opacity: .75; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    #w .dur .q button { margin-left: auto; width: 26px; height: 22px; font-size: 13px; background: none; opacity: .7; flex: none; }
    #w .dur .sl { display: flex; align-items: center; gap: 10px; height: 30px; }
    #w .dur .sl .inf { font-size: 18px; line-height: 1; opacity: .8; width: 20px; text-align: center; }
    #w input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 30px; margin: 0; background: none; touch-action: pan-y; }
    #w input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
      background: linear-gradient(to right, currentColor var(--p, 0%), var(--pill) var(--p, 0%)); }
    #w input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--pill); }
    #w input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: currentColor; }
    #w input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%;
      background: var(--solid); border: 3px solid var(--solid-text); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    #w input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--solid); border: 3px solid var(--solid-text); }
    /* Skeleton: zelfde opbouw en maten als de echte widget, zodat er bij het laden niets verspringt. */
    #w .sk { display: block; border-radius: 999px; background: var(--pill); position: relative; overflow: hidden; }
    #w .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: w-shimmer 1.4s ease-in-out infinite; }
    @media (prefers-color-scheme: dark) { #w .sk::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); } }
    @keyframes w-shimmer { 100% { transform: translateX(100%); } }
    #w .sk.chip { width: 118px; } #w .sk.chip.s { width: 92px; }
    #w .sk.big { width: 96px; height: 52px; border-radius: 12px; }
    #w .sk.btn { width: 40px; height: 40px; }
    #w .sk.out { width: 56px; height: 22px; }
    #w .sk.line { width: 150px; height: 14px; }
    #w .bar.sk { border-radius: 5px; }
    #w .ticks.sk-t { opacity: .35; }
    #w.in > * { animation: w-in .35s ease-out; }
    @keyframes w-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #w .sk::after, #w.in > * { animation: none; } }
  </style>
</head>
<body>
<div id="w" class="loading" aria-busy="true" aria-label="Laden…">
  <div class="top"><span class="sk chip"></span><span class="sk chip s"></span></div>
  <div class="mid">
    <span class="sk big"></span>
    <div class="ctrl"><span class="sk btn"></span><span class="sk out"></span><span class="sk btn"></span></div>
  </div>
  <div class="sub"><span class="sk line"></span></div>
  <div class="barwrap"><div class="bar sk"></div></div>
  <div class="ticks sk-t"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
</div>

<script>
const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MODES = { schedule: 'Volgens schema', preheat: 'Voorverwarmen', manual: 'Handmatig', away: 'Niemand thuis', paused: 'Gepauzeerd' };
const ICON = {
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 15h8m-3-2.5L15.5 15 13 17.5"/></svg>',
  edit: '<svg class="edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5.5.8 1.2 1.6 1.8 2.5 2C11.7 7.5 11.5 5.5 12 3z"/></svg>',
};

let H; let data = null; let loaded = false;
// Keuzerij 'hoe lang?': open/dicht, en een keuze die nog met de temperatuur mee moet.
let durOpen = false; let durTimer = null; let chosenDur = null; let sliding = false; let touched = false; let prevKey = null; let pending = null; let sendTimer = null;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v) => (v == null || Number.isNaN(Number(v)) ? '–' : `${Number(v).toFixed(1)}°`);
const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

function bigTemp(v) {
  if (v == null) return '<span class="temp"><span class="i">–</span></span>';
  const [i, d] = Number(v).toFixed(1).split('.');
  return `<span class="temp"><span class="i">${i}</span><span class="r"><span class="deg">°</span><span class="d"><span class="pt">.</span>${d}</span></span></span>`;
}
function segColor(t) {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  if (t == null) return 'rgba(127,127,127,.3)';
  if (t < 16) return dark ? '#2f6e70' : '#4fa39b';
  if (t < 18) return dark ? '#b8862a' : '#e3b23c';
  if (t < 20) return dark ? '#d07a25' : '#e8892b';
  return dark ? '#d9532b' : '#e0562a';
}
function todayBar(schedule) {
  const idx = new Date().getDay();
  let carry = null;
  for (let s = 1; s <= 7 && carry === null; s++) {
    const prev = schedule[DAY_KEYS[(idx - s + 7) % 7]] || [];
    if (prev.length) carry = Number(prev[prev.length - 1].temp);
  }
  const blocks = (schedule[DAY_KEYS[idx]] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
  const segs = []; let start = 0; let temp = carry;
  for (const b of blocks) { const m = toMin(b.time); if (m > start) segs.push([start, m, temp]); start = m; temp = Number(b.temp); }
  segs.push([start, 1440, temp]);
  const n = new Date(); const nowPct = ((n.getHours() * 60 + n.getMinutes()) / 14.4).toFixed(2);
  return `<div class="barwrap"><div class="bar">${segs.filter((s) => s[1] > s[0]).map((s) => `<i style="flex:${s[1] - s[0]} 0 0;background:${segColor(s[2])}"></i>`).join('')}</div><span class="now" style="left:${nowPct}%"></span></div>
    <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
}
/** Temperatuur die het schema nu voorschrijft (voor directe feedback op 'Schema'). */
function scheduledNow(schedule) {
  const idx = new Date().getDay();
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  let temp = null;
  for (let s = 1; s <= 7 && temp === null; s++) {
    const prev = schedule[DAY_KEYS[(idx - s + 7) % 7]] || [];
    if (prev.length) temp = Number(prev[prev.length - 1].temp);
  }
  for (const b of (schedule[DAY_KEYS[idx]] || []).slice().sort((a, c) => a.time.localeCompare(c.time))) {
    if (toMin(b.time) <= now) temp = Number(b.temp);
  }
  return temp;
}
function timeOf(ms) {
  const d = new Date(ms);
  const same = d.toDateString() === new Date().toDateString();
  return d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', ...(same ? {} : { weekday: 'short' }) });
}

// ---- Duur van de handmatige stand ----
const STOPS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 480, 600, 720];
/** Standen van de schuifbalk: minuten, met 'tot het volgende moment in het schema' op z'n plek, en ∞ aan het eind. */
function durStops(s) {
  const out = STOPS.map((m) => ({ d: m, min: m }));
  if (s.nextChangeAt) {
    const min = Math.max(1, Math.round((s.nextChangeAt - Date.now()) / 60000));
    const near = out.findIndex((o) => Math.abs(o.min - min) < 10);
    if (near >= 0) out.splice(near, 1);
    const at = out.findIndex((o) => o.min > min);
    out.splice(at < 0 ? out.length : at, 0, { d: 'next', min });
  }
  out.push({ d: 'manual', min: Infinity });
  return out;
}
function stopIndex(stops, d) {
  const i = stops.findIndex((o) => String(o.d) === String(d));
  if (i >= 0) return i;
  const m = Number(d); // vrije duur (bijv. uit een flow): dichtstbijzijnde stand
  if (!Number.isFinite(m)) return stops.length - 1;
  let best = 0;
  stops.forEach((o, j) => { if (Math.abs(o.min - m) < Math.abs(stops[best].min - m)) best = j; });
  return best;
}
function hm(ms) {
  const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600); const m = Math.floor((t % 3600) / 60); const sec = t % 60;
  return h ? `${h}u ${m}m ${sec}s` : `${m}m ${sec}s`;
}
function untilOfStop(o) { return o.d === 'manual' ? null : o.d === 'next' ? data.status.nextChangeAt : Date.now() + o.min * 60000; }
/** "Tot 03:41" + aftellen, of "Tot je het schema hervat". */
function durLabel(until, viaSchedule) {
  if (until == null) return { t: 'Tot je het schema hervat', cd: '∞' };
  return { t: `Tot ${timeOf(until)}`, cd: viaSchedule ? `${hm(until - Date.now())} · schema` : hm(until - Date.now()) };
}
function openDur() {
  durOpen = true;
  clearTimeout(durTimer);
  durTimer = setTimeout(() => { if (!sliding) closeDur(); else openDur(); }, 8000); // niets gekozen: standaard laten staan
}
function closeDur() { clearTimeout(durTimer); durOpen = false; sliding = false; touched = false; render(); }
function curDur(s) {
  if (chosenDur != null) return chosenDur;
  if (s.mode === 'manual' && s.override) return s.override.duration || 'next'; // + of − houdt de eindtijd vast
  return s.overrideDefault || 'next';
}
function durPanel(s) {
  const stops = durStops(s);
  const i = stopIndex(stops, curDur(s));
  const until = s.mode === 'manual' && s.override && chosenDur == null && String(curDur(s)) === String(s.override.duration || 'next')
    ? s.override.until : untilOfStop(stops[i]);
  const l = durLabel(until, stops[i].d === 'next');
  return `<div class="dur">
      <div class="q"><b class="dl">${esc(l.t)}</b><span class="cd">${esc(l.cd)}</span><button data-durclose aria-label="Klaar">✕</button></div>
      <div class="sl"><input type="range" min="0" max="${stops.length - 1}" step="1" value="${i}" style="--p:${(i / (stops.length - 1)) * 100}%" aria-label="Hoe lang geldt deze temperatuur"><span class="inf" aria-hidden="true">∞</span></div>
    </div>`;
}
function onSlide(input, commit) {
  const stops = durStops(data.status);
  const o = stops[Number(input.value)];
  input.style.setProperty('--p', `${(Number(input.value) / (stops.length - 1)) * 100}%`);
  const l = durLabel(untilOfStop(o), o.d === 'next');
  const q = input.closest('.dur');
  q.querySelector('.dl').textContent = l.t; q.querySelector('.cd').textContent = l.cd;
  if (commit) chosenDur = o.d;
  return o.d;
}
// Aftellen in de regel en in de schuifbalk, zonder de hele widget opnieuw te tekenen.
setInterval(() => {
  if (!data || !data.status || !data.status.override || sliding) return;
  const cd = document.querySelector('#w .sub .cd');
  if (cd && data.status.override.until != null) cd.textContent = hm(data.status.override.until - Date.now());
  const sl = document.querySelector('#w .dur input');
  if (sl && (touched || chosenDur != null)) onSlide(sl, false); // gekozen stand: 'tot' schuift mee met de klok
  else if (sl && data.status.override.until != null) sl.closest('.dur').querySelector('.cd').textContent = hm(data.status.override.until - Date.now());
}, 1000);

function render() {
  const w = document.getElementById('w');
  if (sliding) return; // niet onder je vinger vandaan tekenen
  if (!loaded) return; // skeleton laten staan tot de eerste poging klaar is
  const first = w.classList.contains('loading');
  w.removeAttribute('aria-busy'); w.removeAttribute('aria-label');
  if (!data || !data.status || !data.status.updatedAt) {
    // Melding in een kaart van dezelfde hoogte, zodat de widget niet krimpt.
    w.className = first ? 'in' : ''; if (first) setTimeout(() => w.classList.remove('in'), 400);
    w.style.minHeight = `${lastHeight}px`;
    w.innerHTML = `<div class="err">${esc((data && data.status && data.status.error) || 'Nog geen gegevens van Slim verwarmen.')}</div>`;
    return;
  }
  w.style.minHeight = '';
  if (first) { w.className = 'in'; setTimeout(() => w.classList.remove('in'), 400); }
  const s = data.status;
  const target = pending != null ? pending : s.thermostatTarget;
  const heating = target != null && s.indoor != null && target > s.indoor + 0.2;
  w.classList.toggle('heat', heating);
  const key = JSON.stringify([s.mode, s.thermostatTarget, s.indoor, s.override && s.override.until]);
  if (prevKey !== null && key !== prevKey && pending == null) { w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  prevKey = key;
  const manual = s.mode === 'manual' && s.override;
  if (durOpen && !manual && pending == null) durOpen = false; // inmiddels terug naar het schema
  let sub;
  if (manual && s.override.until == null) sub = `${ICON.hand}<span>Tot je het schema hervat</span>${ICON.edit}`;
  else if (manual) sub = `${ICON.hand}<span>Tot ${esc(timeOf(s.override.until))}</span><span class="cd">${hm(s.override.until - Date.now())}</span>${ICON.edit}`;
  else if (s.mode === 'preheat') sub = `${ICON.flame}<span>Voorverwarmen voor ${esc(s.nextBlock ? s.nextBlock.at.slice(3) : '')}</span>`;
  else if (s.nextBlock) sub = `<span>Straks ${esc(s.nextBlock.at.slice(3))} → ${fmt(s.nextBlock.temp)}</span>`;
  else sub = '';
  w.innerHTML = `
    <div class="top">
      <span class="chip">${heating ? ICON.flame : ''}${esc(MODES[s.mode] || s.mode)}</span>
      <span class="right">${s.mode === 'manual' ? `<button class="resume" data-act="resume">${ICON.cal}Schema</button>` : `<span class="chip">${fmt(s.outdoor)} buiten</span>`}</span>
    </div>
    <div class="mid">
      ${bigTemp(s.indoor)}
      <div class="ctrl">
        <button data-d="-0.5" aria-label="Kouder">−</button>
        <output aria-label="Ingesteld">${fmt(target)}</output>
        <button data-d="0.5" aria-label="Warmer">+</button>
      </div>
    </div>
    ${durOpen ? durPanel(s)
    : `${manual ? `<button class="sub" data-duropen aria-label="Duur wijzigen">${sub}</button>` : `<div class="sub">${sub}</div>`}
    ${todayBar(data.schedule || {})}`}`;
  setTimeout(fitHeight, 0);
}

// Widgethoogte = gemeten inhoud, zodat er niets wordt afgesneden en er niets te scrollen valt.
let lastHeight = 192;
function fitHeight() {
  const h = Math.ceil(document.getElementById('w').getBoundingClientRect().height);
  if (!H || !h) return;
  if (Math.abs(h - lastHeight) > 1 && typeof H.setHeight === 'function') {
    lastHeight = h; Promise.resolve(H.setHeight(h)).catch(() => {});
  }
}
// Na een actie nog twee keer kijken: de thermostaat bevestigt een wijziging pas na een paar seconden.
function refreshSoon() { setTimeout(load, 4000); setTimeout(load, 12000); }
async function load() {
  try { data = await H.api('GET', '/status'); } catch (e) { /* volgende poging */ }
  loaded = true;
  render();
}

// Schuifbalk: tijdens slepen alleen het label bijwerken, bij loslaten de duur doorgeven.
document.addEventListener('pointerdown', (e) => { if (e.target.matches('#w input[type=range]')) { sliding = true; openDur(); } });
document.addEventListener('input', (e) => {
  if (!e.target.matches('#w input[type=range]')) return;
  sliding = true; touched = true; openDur(); onSlide(e.target, false);
  if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
});
document.addEventListener('change', async (e) => {
  if (!e.target.matches('#w input[type=range]') || !data || !data.status) return;
  const d = onSlide(e.target, true);
  sliding = false; openDur();
  if (pending != null) { sendTemp(); return; } // temperatuur en duur in één keer
  if (!(data.status.mode === 'manual' && data.status.override)) return;
  try { data = await H.api('POST', '/action', { action: 'setDuration', duration: d }); } catch (err) { console.error(err); }
  chosenDur = null; touched = false; render(); refreshSoon();
});
['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => { if (sliding) setTimeout(() => { sliding = false; }, 50); }));

async function sendTemp() {
  clearTimeout(sendTimer); sendTimer = null;
  const temp = pending; const duration = chosenDur;
  try {
    data = await H.api('POST', '/action', duration != null ? { action: 'setTemp', temp, duration } : { action: 'setTemp', temp });
  } catch (err) { console.error(err); }
  pending = null; chosenDur = null; touched = false; render(); refreshSoon();
}

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-duropen]')) { if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback(); openDur(); render(); return; }
  if (e.target.closest('[data-durclose]')) { closeDur(); return; }
  const step = e.target.closest('[data-d]');
  if (step && data && data.status) {
    const base = pending != null ? pending : data.status.thermostatTarget;
    pending = Math.min(28, Math.max(5, Math.round((base + Number(step.dataset.d)) * 2) / 2));
    openDur(); // net als tado: meteen vragen hoe lang, maar zonder keuze geldt de standaard
    render();
    // Even wachten zodat meerdere tikken één wijziging worden.
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendTemp, 1200);
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act && !act.classList.contains('busy')) {
    // Meteen laten zien dat er iets gebeurt; de Homey bevestigt een paar seconden later.
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    act.classList.add('busy');
    act.textContent = 'Bezig…';
    if (act.dataset.act === 'resume' && data && data.status) {
      const st = data.status;
      const t = scheduledNow(data.schedule || {});
      data.status = { ...st, mode: 'schedule', override: null, thermostatTarget: t != null ? t : st.thermostatTarget };
      setTimeout(render, 250);
    }
    try { data = await H.api('POST', '/action', { action: act.dataset.act }); } catch (err) { console.error(err); }
    render(); refreshSoon();
  }
});

function onHomeyReady(Homey) {
  H = Homey;
  // Meteen de hoogte van de skeleton doorgeven: die is gelijk aan de geladen widget.
  lastHeight = Math.ceil(document.getElementById('w').getBoundingClientRect().height) || lastHeight;
  Homey.ready({ height: lastHeight });
  load();
  if (typeof Homey.on === 'function') Homey.on('status', (st) => { if (data) { data.status = st; if (pending == null) render(); } else load(); });
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(render, 60000); // nu-streepje laten meeschuiven
}
</script>
</body>
</html>
