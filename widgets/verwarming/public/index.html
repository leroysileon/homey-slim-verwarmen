<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <style>
    /* Kleur = toestand van de kamer (zelfde als de statustegel in de instellingen):
       groen = rust (basis), geel = opwarmen, blauw = te koud, blauwgroen = te vochtig. Licht en donker gelijk. */
    #w {
      --fg: #ffffff; --pill: rgba(0,0,0,.14); --solid: rgba(0,0,0,.22); --solid-text: #ffffff;
      border-radius: 12px; padding: 14px 16px 14px; background-color: #45c08f; color: var(--fg);
      font: 400 15px/1.35 -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
      display: flex; flex-direction: column; gap: 8px; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    #w { box-sizing: border-box; position: relative; isolation: isolate; overflow: hidden; transition: background-color .9s ease; }
    #w { box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 3px 8px -3px rgba(0,0,0,.12); }
    @media (prefers-color-scheme: dark) { #w { box-shadow: none; } }
    #w.heat { background-color: #f7b52c; }
    #w.cold { background-color: #3b8cf0; }
    #w.humid { background-color: #2f9fb8; }
    /* Zachte glans. */
    #w::before { content: ''; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,0) 55%, rgba(0,0,0,.05)); }
    #w::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
      background: radial-gradient(120% 90% at 20% 30%, rgba(255,255,255,.28), transparent 70%); }
    #w.flash::after { animation: w-flash 1.2s ease-out; }
    @keyframes w-flash { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #w, #w::before { transition: none; } #w.flash::after { animation: none; } }
    /* Niet scrollen of 'meeveren' als je de widget met je vinger versleept. */
    html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; padding: 0 1px 6px; box-sizing: border-box; }
    #w * { box-sizing: border-box; }
    #w .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; height: 32px; flex: none; }
    #w .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--pill); font-size: 13px; font-weight: 600; white-space: nowrap; }
    #w .chip svg { width: 15px; height: 15px; }
    /* Info als gewone tekst met icoontjes, zodat het niet op knoppen lijkt. */
    #w .info { display: inline-flex; align-items: center; gap: 12px; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; }
    #w .info .mode { font-weight: 600; }
    #w .info .it { display: inline-flex; align-items: center; gap: 3px; opacity: .8; }
    #w .info .it svg { width: 13px; height: 13px; flex: none; }
    #w .info .it.high { opacity: 1; font-weight: 700; }
    /* Golfjes los boven het getal, zodat ze de rij niet verschuiven. */
    /* Golfjes naast de huidige temperatuur: 'het wordt warmer'. */
    #w .tw { position: relative; display: inline-flex; align-items: center; }
    #w .waves { display: inline-flex; width: 18px; height: 18px; margin-left: 6px; align-self: center; opacity: 0; transition: opacity .6s; pointer-events: none; }
    #w.heat .waves { opacity: 1; }
    /* Knipperen zolang de thermostaat de nieuwe temperatuur nog niet heeft bevestigd. */
    #w.heat .waves.blink { animation: w-blink 1s ease-in-out infinite; }
    @keyframes w-blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { #w.heat .waves.blink { animation: none; opacity: .5; } }
    #w .waves svg { width: 18px; height: 18px; }
    #w .mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 56px; flex: none; }
    #w .temp { display: inline-flex; align-items: flex-start; font-weight: 600; line-height: .9; letter-spacing: -.03em; }
    #w .temp .i { font-size: 58px; }
    #w .temp .r { display: flex; flex-direction: column; justify-content: space-between; height: 52px; margin-left: 7px; align-items: flex-start; }
    #w .temp .pt { position: absolute; right: 100%; bottom: 0; }
    #w .temp .deg { font-size: 26px; line-height: 1; }
    #w .temp .d { font-size: 23px; line-height: 1; position: relative; align-self: flex-start; }
    #w .ctrl { display: flex; align-items: center; gap: 2px; }
    #w button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 999px; background: var(--pill); color: inherit; font: inherit; font-weight: 600; transition: transform .06s; }
    #w button:active { transform: scale(.94); }
    #w .ctrl button { width: 40px; height: 40px; padding: 0; flex: none; }
    #w .ctrl button svg { width: 18px; height: 18px; display: block; }
    #w .ctrl .val { position: relative; width: 60px; text-align: center; }
    #w .ctrl output { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    #w .sub { display: flex; align-items: center; gap: 6px; font-size: 14px; height: 20px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #w .sub svg { width: 17px; height: 17px; flex: none; }
    #w .bar { position: relative; display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: 2px; }
    #w .bar i { display: block; height: 100%; }
    /* Handmatige periode: omlijning om dat stuk van de balk, met afgeronde hoeken (tekstkleur: zwart in lichte modus). */
    #w .barwrap .manual { position: absolute; top: -2px; height: 14px; margin-left: -2px; padding: 0; box-sizing: content-box;
      border: 2px solid currentColor; border-radius: 8px; pointer-events: none; }
    #w .barwrap { position: relative; height: 12px; flex: none; }
    /* Nu-streepje verticaal gecentreerd op de balk, horizontaal precies op het tijdstip. */
    #w .now { position: absolute; top: -1px; width: 3px; height: 16px; border-radius: 2px; background: currentColor; transform: translateX(-1.5px); }
    #w .ticks { display: flex; justify-content: space-between; font-size: 11px; line-height: 14px; height: 14px; opacity: .7; margin-top: -2px; flex: none; }
    #w .resume { flex: none; white-space: nowrap; height: 32px; padding: 0 12px; font-size: 14px; background: var(--solid); color: var(--solid-text); }
    #w .resume svg { width: 16px; height: 16px; }
    #w .err { font-size: 13px; }
    #w button.busy { opacity: .7; pointer-events: none; animation: w-pulse 1s ease-in-out infinite; }
    @keyframes w-pulse { 50% { opacity: .45; } }
    #w .right { display: inline-flex; align-items: center; gap: 6px; }
    /* Hoe lang geldt de handmatige stand? Schuifbalk, ∞ aan het eind.
       Neemt precies de plek van regel + dagbalk in, zodat de widget niet verspringt. */
    #w button.sub { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: 14px; height: 20px; flex: none;
      white-space: nowrap; overflow: hidden; cursor: pointer; color: inherit; }
    #w button.sub .cd { font-variant-numeric: tabular-nums; opacity: .75; }
    #w button.sub .edit { width: 15px; height: 15px; opacity: .75; }
    #w .dur { height: 60px; flex: none; display: flex; flex-direction: column; gap: 4px; }
    #w .dur .q { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 14px; white-space: nowrap; }
    #w .dur .q b { font-weight: 600; }
    #w .dur .q .cd { opacity: .75; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
    /* Sluitknop: rond, duidelijk icoon, groter tikvlak dan zichtbaar. */
    #w .dur .q .x { position: relative; margin-left: auto; width: 26px; height: 26px; flex: none; background: var(--pill); }
    #w .dur .q .x svg { width: 13px; height: 13px; display: block; }
    #w .dur .q .x::after { content: ''; position: absolute; inset: -9px; }
    /* Rustige overgang, alleen bij openen/sluiten van het duurpaneel. */
    #w .enter { animation: w-enter .28s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes w-enter { from { opacity: 0; transform: translateY(5px); } }
    @media (prefers-reduced-motion: reduce) { #w .enter { animation: none; } }
    #w .dur .sl { display: flex; align-items: center; gap: 10px; height: 30px; }
    #w .dur .nx { flex: none; height: 30px; padding: 0 11px; font-size: 13px; white-space: nowrap; }
    #w .dur .nx.on { background: var(--solid); color: var(--solid-text); }
    #w input[type=range].off { opacity: .45; }
    #w .dur .sl .inf { font-size: 18px; line-height: 1; opacity: .8; width: 20px; text-align: center; }
    #w input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 30px; margin: 0; background: none; touch-action: pan-y; }
    #w input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
      background: linear-gradient(to right, currentColor var(--p, 0%), var(--pill) var(--p, 0%)); }
    #w input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--pill); }
    #w input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: currentColor; }
    #w input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%;
      background: #ffffff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    #w input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #ffffff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    /* Skeleton: zelfde opbouw en maten als de echte widget, zodat er bij het laden niets verspringt. */
    #w .sk { display: block; border-radius: 999px; background: var(--pill); position: relative; overflow: hidden; }
    #w .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: w-shimmer 1.4s ease-in-out infinite; }
    @media (prefers-color-scheme: dark) { #w .sk::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); } }
    @keyframes w-shimmer { 100% { transform: translateX(100%); } }
    #w .sk.chip { width: 118px; } #w .sk.chip.s { width: 92px; }
    #w .sk.big { width: 96px; height: 52px; border-radius: 12px; }
    #w .sk.btn { width: 40px; height: 40px; }
    #w .sk.out { width: 56px; height: 22px; }
    #w .sk.line { width: 150px; height: 14px; }
    #w .bar.sk { border-radius: 5px; }
    #w .ticks.sk-t { opacity: .35; }
    #w.in > * { animation: w-in .35s ease-out; }
    @keyframes w-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #w .sk::after, #w.in > * { animation: none; } }
  </style>
</head>
<body>
<div id="w" class="loading" aria-busy="true" aria-label="Laden…">
  <div class="top"><span class="sk chip"></span><span class="sk chip s"></span></div>
  <div class="mid">
    <span class="sk big"></span>
    <div class="ctrl"><span class="sk btn"></span><span class="sk out"></span><span class="sk btn"></span></div>
  </div>
  <div class="sub"><span class="sk line"></span></div>
  <div class="barwrap"><div class="bar sk"></div></div>
  <div class="ticks sk-t"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
</div>

<script>
const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const MODES = { schedule: 'Volgens schema', preheat: 'Voorverwarmen', manual: 'Handmatig', away: 'Niemand thuis', paused: 'Gepauzeerd' };
const ICON = {
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  waves: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 5c-1.5 2 1.5 3.5 0 5.5S7 14 7 16m5-11c-1.5 2 1.5 3.5 0 5.5s0 3.5 0 5.5m5-11c-1.5 2 1.5 3.5 0 5.5s0 3.5 0 5.5"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.6a1.5 1.5 0 0 1 2.3-1.9L9 16"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 15h8m-3-2.5L15.5 15 13 17.5"/></svg>',
  edit: '<svg class="edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-5.5.8 1.2 1.6 1.8 2.5 2C11.7 7.5 11.5 5.5 12 3z"/></svg>',
};

let confirmPoll = null;
const COLD_BELOW = 16; // °C: kouder dan dit = blauw
const HUMID_FROM = 65; // %: vanaf dit = te vochtig
let H; let data = null; let loaded = false;
// Keuzerij 'hoe lang?': open/dicht, en een keuze die nog met de temperatuur mee moet.
let durOpen = false; let durTimer = null; let chosenDur = null; let sliding = false; let touched = false; let prevKey = null; let pending = null; let sendTimer = null;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v) => (v == null || Number.isNaN(Number(v)) ? '–' : `${Number(v).toFixed(1)}°`);
const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };

function bigTemp(v) {
  if (v == null) return '<span class="temp"><span class="i">–</span></span>';
  const [i, d] = Number(v).toFixed(1).split('.');
  return `<span class="temp"><span class="i">${i}</span><span class="r"><span class="deg">°</span><span class="d"><span class="pt">.</span>${d}</span></span></span>`;
}
/** Gedeeld palet (zelfde als het weekschema): laag = turquoise-groen, 16–18 = geel, 18–20 = oranje, 20+ = rood-oranje. */
const PALETTE = { low: '#45c08f', mild: '#f7b52c', warm: '#ee8a35', hot: '#e5603a' };
/** Heldere kleuren voor de balk: normaal = licht mint, verwarmen = zonnig geel, warm = oranje, heel warm = koraal. */
// 'low' is een wit laagje over de achtergrond, zodat het past bij groen, geel en blauw.
const TINT = { low: 'rgba(255,255,255,.5)', mild: '#ffd84d', warm: '#ff9f43', hot: '#ff6a4d' };
function segColor(t) {
  if (t == null) return 'rgba(255,255,255,.3)';
  if (t < 16) return TINT.low;
  if (t < 18) return TINT.mild;
  if (t < 20) return TINT.warm;
  return TINT.hot;
}
function todayBar(schedule, st) {
  const idx = new Date().getDay();
  let carry = null;
  for (let s = 1; s <= 7 && carry === null; s++) {
    const prev = schedule[DAY_KEYS[(idx - s + 7) % 7]] || [];
    if (prev.length) carry = Number(prev[prev.length - 1].temp);
  }
  const blocks = (schedule[DAY_KEYS[idx]] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
  const segs = []; let start = 0; let temp = carry;
  for (const b of blocks) { const m = toMin(b.time); if (m > start) segs.push([start, m, temp]); start = m; temp = Number(b.temp); }
  segs.push([start, 1440, temp]);
  const n = new Date(); const nowPct = ((n.getHours() * 60 + n.getMinutes()) / 14.4).toFixed(2);
  // Handmatig vak: van instellen tot einde handmatige stand, gestreept in de kleur van de ingestelde temperatuur.
  let manualBox = '';
  const o = st && st.mode === 'manual' && st.override;
  if (o) {
    const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
    const toM = (ms) => Math.max(0, Math.min(1440, (ms - dayStart.getTime()) / 60000));
    const from = toM(o.since || Date.now());
    const to = o.until == null ? 1440 : toM(o.until);
    if (to > from) {
      manualBox = `<span class="manual" style="left:${(from / 14.4).toFixed(2)}%;width:${((to - from) / 14.4).toFixed(2)}%" title="Handmatig ${deg(o.temp)}"></span>`;
    }
  }
  return `<div class="barwrap"><div class="bar">${segs.filter((s) => s[1] > s[0]).map((s) => `<i style="flex:${s[1] - s[0]} 0 0;background:${segColor(s[2])}"></i>`).join('')}</div>${manualBox}<span class="now" style="left:${nowPct}%"></span></div>
    <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
}
/** Temperatuur die het schema nu voorschrijft (voor directe feedback op 'Schema'). */
function scheduledNow(schedule) {
  const idx = new Date().getDay();
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  let temp = null;
  for (let s = 1; s <= 7 && temp === null; s++) {
    const prev = schedule[DAY_KEYS[(idx - s + 7) % 7]] || [];
    if (prev.length) temp = Number(prev[prev.length - 1].temp);
  }
  for (const b of (schedule[DAY_KEYS[idx]] || []).slice().sort((a, c) => a.time.localeCompare(c.time))) {
    if (toMin(b.time) <= now) temp = Number(b.temp);
  }
  return temp;
}
// ---- Tijden in gewone taal: "08:30 uur", met "morgen" of de dag als het niet vandaag is ----
const clock = (ms) => `${new Date(ms).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })} uur`;
function dayWord(ms) {
  const d = new Date(ms); const today = new Date();
  const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);
  if (d.toDateString() === today.toDateString()) return '';
  if (d.toDateString() === tomorrow.toDateString()) return 'morgen';
  return d.toLocaleDateString('nl-NL', { weekday: 'long' });
}
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
/** "08:30 uur", "morgen 08:30 uur" of "zaterdag 08:30 uur" (na 'Tot'). */
function timeOf(ms) { const w = dayWord(ms); return `${w ? `${w} ` : ''}${clock(ms)}`; }
/** "om 08:30 uur", "morgen om 08:30 uur" of "zaterdag om 08:30 uur". */
function whenAt(ms) { const w = dayWord(ms); return `${w ? `${w} ` : ''}om ${clock(ms)}`; }
/** Tijdstip (ms) van het volgende blok in het schema. */
const nextBlockAt = (s) => (s.nextBlock && s.nextBlock.inMinutes != null ? (s.updatedAt || Date.now()) + s.nextBlock.inMinutes * 60000 : null);
/** 17° of 17.5° (zonder overbodige .0). */
const deg = (v) => `${Number(v) % 1 ? Number(v).toFixed(1) : Number(v).toFixed(0)}°`;

// ---- Duur van de handmatige stand ----
// Knop 'Tot 08:30' = tot het volgende moment in het schema. Schuifbalk = vaste duur, ∞ aan het eind.
const STOPS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300, 360, 480, 600, 720, Infinity];
const durOfStop = (i) => (STOPS[i] === Infinity ? 'manual' : STOPS[i]);
function stopIndex(d) {
  if (d === 'manual') return STOPS.length - 1;
  const m = Number(d); // ook vrije duur (bijv. uit een flow): dichtstbijzijnde stand
  let best = 0;
  STOPS.forEach((v, j) => { if (Math.abs(v - m) < Math.abs(STOPS[best] - m)) best = j; });
  return best;
}
/** Resterende tijd in uren en minuten, zonder seconden. Naar boven afgerond: nooit '0m' zolang er nog tijd is. */
function hm(ms) {
  if (ms <= 0) return '0m';
  const t = Math.ceil(ms / 60000); const h = Math.floor(t / 60); const m = t % 60;
  return h ? `${h}u ${m}m` : `${m}m`;
}
/** Tijd van het volgende blok zoals in het schema staat ("08:30"). */
const nextAt = (s) => (nextBlockAt(s) ? timeOf(nextBlockAt(s)) : '');
function untilOf(s, d) { return d === 'manual' ? null : d === 'next' ? s.nextChangeAt : Date.now() + d * 60000; }
/** "Tot 03:41" + aftellen, of "Tot je het schema hervat". */
function durLabel(s, d, until) {
  if (until == null) return { t: 'Tot je het schema hervat', cd: '' };
  return { t: `Tot ${d === 'next' && nextAt(s) ? nextAt(s) : timeOf(until)}`, cd: hm(until - Date.now()) };
}
function openDur() {
  if (!durOpen) enterPanel = true;
  durOpen = true;
  clearTimeout(durTimer);
  durTimer = setTimeout(() => { if (!sliding) closeDur(); else openDur(); }, 8000); // niets gekozen: standaard laten staan
}
let enterPanel = false; let enterRow = false; // alleen bij openen/sluiten animeren, niet bij elke verversing
function closeDur() { clearTimeout(durTimer); if (durOpen) enterRow = true; durOpen = false; sliding = false; touched = false; render(); }
function curDur(s) {
  if (chosenDur != null) return chosenDur;
  if (s.mode === 'manual' && s.override) return s.override.duration || 'next'; // + of − houdt de eindtijd vast
  return s.overrideDefault || 'next';
}
function durPanel(s) {
  const d = curDur(s);
  const isNext = String(d) === 'next';
  const sameAsNow = s.mode === 'manual' && s.override && chosenDur == null;
  const l = durLabel(s, d, sameAsNow ? s.override.until : untilOf(s, d));
  const i = isNext ? stopIndex(Math.max(1, ((s.nextChangeAt || Date.now()) - Date.now()) / 60000)) : stopIndex(d);
  const enter = enterPanel ? ' enter' : ''; enterPanel = false;
  return `<div class="dur${enter}">
      <div class="q"><b class="dl">${esc(l.t)}</b><span class="cd">${esc(l.cd)}</span><button class="x" data-durclose aria-label="Klaar">${ICON.x}</button></div>
      <div class="sl">
        <button class="nx${isNext ? ' on' : ''}" data-next aria-pressed="${isNext}">Volgend tijdsblok</button>
        <input class="${isNext ? 'off' : ''}" type="range" min="0" max="${STOPS.length - 1}" step="1" value="${i}" style="--p:${(i / (STOPS.length - 1)) * 100}%" aria-label="Hoe lang geldt deze temperatuur">
        <span class="inf" aria-hidden="true">∞</span>
      </div>
    </div>`;
}
/** Label en balk bijwerken voor duur d, zonder opnieuw te tekenen. */
function showDur(panel, d) {
  const s = data.status;
  const l = durLabel(s, d, untilOf(s, d));
  panel.querySelector('.dl').textContent = l.t; panel.querySelector('.cd').textContent = l.cd;
  const input = panel.querySelector('input'); const nx = panel.querySelector('.nx');
  input.classList.toggle('off', d === 'next'); nx.classList.toggle('on', d === 'next'); nx.setAttribute('aria-pressed', String(d === 'next'));
  input.style.setProperty('--p', `${(Number(input.value) / (STOPS.length - 1)) * 100}%`);
}
// Aftellen in de regel en in het paneel, zonder de hele widget opnieuw te tekenen.
setInterval(() => {
  if (!data || !data.status || sliding) return;
  const ov = data.status.override;
  const cd = document.querySelector('#w .sub .cd');
  if (cd && ov && ov.until != null) cd.textContent = hm(ov.until - Date.now());
  const panel = document.querySelector('#w .dur');
  if (!panel) return;
  if (touched || chosenDur != null || !ov) showDur(panel, curDur(data.status)); // gekozen stand: 'tot' schuift mee met de klok
  else if (ov.until != null) panel.querySelector('.cd').textContent = hm(ov.until - Date.now());
}, 1000);
async function commitDur(d) {
  chosenDur = d; touched = true; openDur();
  if (pending != null) { sendTemp(); return; } // temperatuur en duur in één keer
  if (!(data.status.mode === 'manual' && data.status.override)) return;
  try { data = await H.api('POST', '/action', { action: 'setDuration', duration: d }); } catch (err) { console.error(err); }
  chosenDur = null; touched = false; render(); refreshSoon();
}

function render() {
  const w = document.getElementById('w');
  if (sliding) return; // niet onder je vinger vandaan tekenen
  if (!loaded) return; // skeleton laten staan tot de eerste poging klaar is
  const first = w.classList.contains('loading');
  w.removeAttribute('aria-busy'); w.removeAttribute('aria-label');
  if (!data || !data.status || !data.status.updatedAt) {
    // Melding in een kaart van dezelfde hoogte, zodat de widget niet krimpt.
    w.className = first ? 'in' : ''; if (first) setTimeout(() => w.classList.remove('in'), 400);
    w.style.minHeight = `${lastHeight}px`;
    w.innerHTML = `<div class="err">${esc((data && data.status && data.status.error) || 'Nog geen gegevens van Slim verwarmen.')}</div>`;
    return;
  }
  w.style.minHeight = '';
  if (first) { w.className = 'in'; setTimeout(() => w.classList.remove('in'), 400); }
  const s = data.status;
  const target = pending != null ? pending : s.thermostatTarget;
  const heating = target != null && s.indoor != null && target > s.indoor + 0.2;
  // Toestand: verwarmen gaat voor, dan te koud, dan te vochtig.
  const cold = !heating && s.indoor != null && s.indoor < COLD_BELOW;
  const humid = !heating && !cold && s.humidity != null && s.humidity >= HUMID_FROM;
  w.classList.toggle('heat', heating);
  w.classList.toggle('cold', cold);
  w.classList.toggle('humid', humid);
  const key = JSON.stringify([s.mode, s.thermostatTarget, s.indoor, s.override && s.override.until]);
  if (prevKey !== null && key !== prevKey && pending == null) { w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash'); }
  prevKey = key;
  const manual = s.mode === 'manual' && s.override;
  if (durOpen && !manual && pending == null) durOpen = false; // inmiddels terug naar het schema
  let sub;
  if (manual && s.override.until == null) sub = `${ICON.hand}<span>Tot je het schema hervat</span>${ICON.edit}`;
  else if (manual) sub = `${ICON.hand}<span>${esc(durLabel(s, s.override.duration || 'next', s.override.until).t)}</span><span class="cd">${hm(s.override.until - Date.now())}</span>${ICON.edit}`;
  else if (s.mode === 'preheat') sub = `${ICON.flame}<span>Voorverwarmen voor ${esc(nextAt(s))}</span>`;
  else if (s.nextBlock && nextBlockAt(s)) sub = `<span>${esc(cap(whenAt(nextBlockAt(s))))} → ${deg(s.nextBlock.temp)}</span>`;
  else sub = '';
  const waiting = heating && (pending == null) && s.targetConfirmed === false;
  clearTimeout(confirmPoll); if (waiting) confirmPoll = setTimeout(load, 3000); // wacht op bevestiging: vaker kijken
  w.innerHTML = `
    <div class="top">
      <span class="info">
        <span class="mode">${esc(MODES[s.mode] || s.mode)}</span>
        ${s.humidity != null ? `<span class="it${s.humidity >= HUMID_FROM ? ' high' : ''}" aria-label="Luchtvochtigheid ${s.humidity}%${s.humidity >= HUMID_FROM ? ', te vochtig' : ''}">${ICON.drop}${s.humidity}%</span>` : ''}
        ${s.outdoor != null && s.mode !== 'manual' ? `<span class="it" aria-label="Buiten ${fmt(s.outdoor)}">${ICON.cloud}${fmt(s.outdoor)}</span>` : ''}
      </span>
      ${s.mode === 'manual' ? `<button class="resume" data-act="resume">${ICON.cal}Hervat schema</button>` : ''}
    </div>
    <div class="mid">
      <span class="tw">${bigTemp(s.indoor)}<span class="waves${heating && (pending != null || s.targetConfirmed === false) ? ' blink' : ''}" aria-hidden="true">${ICON.waves}</span></span>
      <div class="ctrl">
        <button data-d="-0.5" aria-label="Kouder">${ICON.minus}</button>
        <span class="val"><output aria-label="Ingesteld">${fmt(target)}</output></span>
        <button data-d="0.5" aria-label="Warmer">${ICON.plus}</button>
      </div>
    </div>
    ${durOpen ? durPanel(s)
    : `${manual ? `<button class="sub" data-duropen aria-label="Duur wijzigen">${sub}</button>` : `<div class="sub">${sub}</div>`}
    ${todayBar(data.schedule || {}, s)}`}`;
  if (enterRow && !durOpen) { w.querySelectorAll('.sub, .barwrap, .ticks').forEach((el) => el.classList.add('enter')); enterRow = false; }
  setTimeout(fitHeight, 0);
}

// Widgethoogte = gemeten inhoud, zodat er niets wordt afgesneden en er niets te scrollen valt.
let lastHeight = 198;
function fitHeight() {
  const h = Math.ceil(document.getElementById('w').getBoundingClientRect().height) + 6; // + ruimte voor de schaduw
  if (!H || !h) return;
  if (Math.abs(h - lastHeight) > 1 && typeof H.setHeight === 'function') {
    lastHeight = h; Promise.resolve(H.setHeight(h)).catch(() => {});
  }
}
// Na een actie nog twee keer kijken: de thermostaat bevestigt een wijziging pas na een paar seconden.
function refreshSoon() { setTimeout(load, 4000); setTimeout(load, 12000); }
async function load() {
  try { data = await H.api('GET', '/status'); } catch (e) { /* volgende poging */ }
  loaded = true;
  render();
}

// Schuifbalk: tijdens slepen alleen het label bijwerken, bij loslaten de duur doorgeven.
document.addEventListener('pointerdown', (e) => { if (e.target.matches('#w input[type=range]')) { sliding = true; openDur(); } });
document.addEventListener('input', (e) => {
  if (!e.target.matches('#w input[type=range]')) return;
  sliding = true; touched = true; chosenDur = durOfStop(Number(e.target.value)); openDur();
  showDur(e.target.closest('.dur'), chosenDur);
  if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
});
document.addEventListener('change', (e) => {
  if (!e.target.matches('#w input[type=range]') || !data || !data.status) return;
  sliding = false;
  commitDur(durOfStop(Number(e.target.value)));
});
['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => { if (sliding) setTimeout(() => { sliding = false; }, 50); }));

async function sendTemp() {
  clearTimeout(sendTimer); sendTimer = null;
  const temp = pending; const duration = chosenDur;
  try {
    data = await H.api('POST', '/action', duration != null ? { action: 'setTemp', temp, duration } : { action: 'setTemp', temp });
  } catch (err) { console.error(err); }
  pending = null; chosenDur = null; touched = false; render(); refreshSoon();
}

document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-duropen]')) { if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback(); openDur(); render(); return; }
  if (e.target.closest('[data-durclose]')) { closeDur(); return; }
  if (e.target.closest('[data-next]') && data && data.status) {
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    showDur(e.target.closest('.dur'), 'next');
    commitDur('next');
    return;
  }
  const step = e.target.closest('[data-d]');
  if (step && data && data.status) {
    const base = pending != null ? pending : data.status.thermostatTarget;
    pending = Math.min(28, Math.max(5, Math.round((base + Number(step.dataset.d)) * 2) / 2));
    openDur(); // meteen vragen hoe lang, maar zonder keuze geldt de standaard
    render();
    // Even wachten zodat meerdere tikken één wijziging worden.
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendTemp, 1200);
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act && !act.classList.contains('busy')) {
    // Meteen laten zien dat er iets gebeurt; de Homey bevestigt een paar seconden later.
    if (H && typeof H.hapticFeedback === 'function') H.hapticFeedback();
    act.classList.add('busy');
    act.textContent = 'Bezig…';
    if (act.dataset.act === 'resume' && data && data.status) {
      const st = data.status;
      const t = scheduledNow(data.schedule || {});
      data.status = { ...st, mode: 'schedule', override: null, thermostatTarget: t != null ? t : st.thermostatTarget };
      setTimeout(render, 250);
    }
    try { data = await H.api('POST', '/action', { action: act.dataset.act }); } catch (err) { console.error(err); }
    render(); refreshSoon();
  }
});

function onHomeyReady(Homey) {
  H = Homey;
  // Meteen de hoogte van de skeleton doorgeven: die is gelijk aan de geladen widget.
  lastHeight = Math.ceil(document.getElementById('w').getBoundingClientRect().height) || lastHeight;
  Homey.ready({ height: lastHeight });
  load();
  if (typeof Homey.on === 'function') Homey.on('status', (st) => { if (data) { data.status = st; if (pending == null) render(); } else load(); });
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(render, 60000); // nu-streepje laten meeschuiven
}
</script>
</body>
</html>
